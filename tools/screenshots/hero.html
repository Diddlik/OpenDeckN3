<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1280px;height:860px;overflow:hidden;font-family:Geist,sans-serif;color:#ECEEF1;
 background:radial-gradient(700px 420px at 12% 0%,rgba(53,224,208,.22),transparent 70%),radial-gradient(640px 420px at 95% 100%,rgba(124,58,237,.28),transparent 70%),#0B0D10;position:relative}
body:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(#000,transparent 85%)}
.top{position:relative;text-align:center;padding-top:40px}
.brand{display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:600;letter-spacing:-.02em}
.brand b{color:#35E0D0;font-weight:600}
h1{margin:20px 0 0;font-size:54px;line-height:1.05;font-weight:700;letter-spacing:-.035em}
h1 span{background:linear-gradient(90deg,#35E0D0,#8B7CFF);-webkit-background-clip:text;color:transparent}
.chips{margin-top:20px;display:flex;justify-content:center;gap:10px}
.chips span{font-size:14px;font-weight:500;color:#A0A7B2;padding:6px 14px;border-radius:999px;border:1px solid #2A2F37;background:rgba(23,26,31,.7)}
.win{position:absolute;left:50%;top:300px;width:1080px;transform:translateX(-50%);border-radius:16px;overflow:hidden;border:1px solid #2E333B;box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03),0 -10px 80px rgba(53,224,208,.12)}
.bar{height:34px;background:#171A1F;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid #22262D}
.bar i{width:11px;height:11px;border-radius:50%;background:#2E333B}.bar em{margin-left:auto;margin-right:auto;font-style:normal;font-size:12px;color:#8A929E;transform:translateX(-30px)}
.win img{display:block;width:100%}
</style></head><body>
<div class="top">
 <div class="brand"><svg width="56" height="56" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#171A1F" stroke="#2E333B"/><rect x="5" y="7" width="4.5" height="4.5" rx="1.2" fill="#35E0D0"/><rect x="11" y="7" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><rect x="17" y="7" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><rect x="5" y="13" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><rect x="11" y="13" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><rect x="17" y="13" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><circle cx="7.2" cy="22" r="1.6" fill="#5B6370"/><circle cx="13.2" cy="22" r="1.6" fill="#5B6370"/><circle cx="19.2" cy="22" r="1.6" fill="#5B6370"/><circle cx="24.5" cy="10" r="2.4" fill="none" stroke="#35E0D0" stroke-width="1.4"/><circle cx="24.5" cy="20.5" r="1.6" fill="none" stroke="#A0A7B2" stroke-width="1.2"/></svg><span>OpenDeck<b>N3</b></span></div>
 <h1>Dein Stream-Controller.<br><span>Endlich richtig gesteuert.</span></h1>
 <div class="chips"><span>Open Source</span><span>Plugins</span><span>Windows &amp; Linux</span><span>Drag &amp; Drop</span></div>
</div>
<div class="win"><div class="bar"><i></i><i></i><i></i><em>OpenDeckN3</em></div><img src="editor-dark.png"></div>
</body></html>
