name: Windows-Installer

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release erstellen (z. B. v0.1.0-alpha.1) – leer lassen für reinen Testbuild"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version bestimmen
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="$RELEASE_TAG"
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::release_tag muss wie v1.2.3 oder v1.2.3-alpha.1 aussehen"; exit 1
            fi
            version="${tag#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          else
            version="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: cargo test

      - name: Release bauen
        run: cargo build --release -p n3-daemon

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y

      - name: Installer bauen
        shell: pwsh
        run: |
          # target/ kommt teils aus dem Cache – keine alten Pakete mitveröffentlichen.
          Remove-Item -Recurse -Force target\installer, target\portable -ErrorAction SilentlyContinue
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer\windows\opendeckn3.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable ZIP
        shell: pwsh
        run: |
          $dir = "target\portable\OpenDeckN3"
          New-Item -ItemType Directory -Force "$dir\plugins" | Out-Null
          Copy-Item target\release\opendeckn3d.exe, LICENSE, README.md, assets\icon.ico $dir
          Copy-Item -Recurse plugins\examples\* "$dir\plugins"
          Compress-Archive -Path $dir -DestinationPath "target\installer\OpenDeckN3-${{ steps.version.outputs.version }}-windows-x64-portable.zip" -Force

      - name: Smoke-Test der Release-Binary
        shell: pwsh
        run: |
          $env:RUST_LOG = "debug"
          $p = Start-Process target\release\opendeckn3d.exe -ArgumentList "--virtual","--no-hardware","--plugins-dir","plugins\examples","--config-dir","$env:RUNNER_TEMP\n3cfg" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\daemon.out" -RedirectStandardError "$env:RUNNER_TEMP\daemon.err"
          Start-Sleep -Seconds 3
          node tools/smoke-test.mjs
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP\daemon.out", "$env:RUNNER_TEMP\daemon.err" -Tail 80 }
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDeckN3-${{ steps.version.outputs.version }}-windows-x64
          path: target/installer/*

      # Bei Tag-Push oder manuellem Start mit release_tag. Existiert das Tag noch nicht,
      # legt GitHub es auf dem gebauten Commit an.
      - name: GitHub-Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenDeckN3 ${{ steps.version.outputs.version }}
          files: target/installer/*
          generate_release_notes: true
          # v0.1.0-alpha.1 etc. → als Vorabversion markieren
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
