name: Windows-Installer

# Baut die Desktop-App (Tauri) mit NSIS-Installer und portablem ZIP.
# Release: "Run workflow" mit release_tag (z. B. v0.1.0-alpha.2) oder Tag-Push v*.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release erstellen (z. B. v0.1.0-alpha.1) – leer lassen für reinen Testbuild"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version bestimmen
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="$RELEASE_TAG"
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::release_tag muss wie v1.2.3 oder v1.2.3-alpha.1 aussehen"; exit 1
            fi
            version="${tag#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          else
            version="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: cargo test

      - name: Dienst (CLI) und Discord-Plugin bauen
        run: cargo build --release -p n3-daemon -p opendeckn3-discord -p opendeckn3-obs -p opendeckn3-homeassistant

      - name: Desktop-App + Installer bauen (Tauri)
        shell: pwsh
        working-directory: crates/n3-desktop
        run: |
          @{ version = "${{ steps.version.outputs.version }}" } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\tauri-version.json"
          npx --yes @tauri-apps/cli@2 build --ci --config "$env:RUNNER_TEMP\tauri-version.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pakete zusammenstellen
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          # target/ kommt teils aus dem Cache – keine alten Pakete mitveröffentlichen.
          Remove-Item -Recurse -Force target\installer, target\portable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force target\installer | Out-Null
          $setup = Get-ChildItem "target\release\bundle\nsis\OpenDeckN3_${v}_x64-setup.exe"
          Copy-Item $setup "target\installer\OpenDeckN3-$v-windows-x64-setup.exe"

          $dir = "target\portable\OpenDeckN3"
          New-Item -ItemType Directory -Force "$dir\plugins" | Out-Null
          Copy-Item target\release\OpenDeckN3.exe, LICENSE, README.md, README.de.md $dir
          Copy-Item -Recurse plugins\examples\* "$dir\plugins"
          Compress-Archive -Path $dir -DestinationPath "target\installer\OpenDeckN3-$v-windows-x64-portable.zip" -Force

          # Beispiel-Plugin als installierbare Datei (Plugin-Katalog: plugins/registry.json).
          # Version = Release-Version, sonst meldet der Katalog nach jedem Update erneut eines.
          $plugin = "de.opendeckn3.counter"
          $dir = "$env:RUNNER_TEMP\pkg-counter\$plugin.sdPlugin"
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\pkg-counter" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse "plugins\examples\$plugin.sdPlugin\*" $dir
          $m = Get-Content "$dir\manifest.json" -Raw -Encoding utf8
          $m = $m -replace '"Version":\s*"[^"]*"', ('"Version": "' + $v + '"')
          [IO.File]::WriteAllText("$dir\manifest.json", $m)
          Compress-Archive -Path $dir -DestinationPath "$env:RUNNER_TEMP\$plugin.zip" -Force
          Copy-Item "$env:RUNNER_TEMP\$plugin.zip" "target\installer\$plugin.streamDeckPlugin"

          # Eigene Plugins (Windows-Binaries); Plugin-Version = Release-Version, damit der Katalog Updates erkennt.
          foreach ($p in @("discord", "obs", "homeassistant")) {
            $uuid = "de.opendeckn3.$p"
            $dir = "$env:RUNNER_TEMP\pkg-$p\$uuid.sdPlugin"
            Remove-Item -Recurse -Force "$env:RUNNER_TEMP\pkg-$p" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item -Recurse "plugins\$p\$uuid.sdPlugin\*" $dir
            Copy-Item "target\release\opendeckn3-$p.exe" $dir
            # Textersetzung statt JSON-Rundreise (PowerShell verändert sonst verschachtelte Arrays).
            $m = Get-Content "$dir\manifest.json" -Raw -Encoding utf8
            $m = $m -replace '"Version":\s*"[^"]*"', ('"Version": "' + $v + '"')
            [IO.File]::WriteAllText("$dir\manifest.json", $m)
            Compress-Archive -Path $dir -DestinationPath "$env:RUNNER_TEMP\$p.zip" -Force
            Copy-Item "$env:RUNNER_TEMP\$p.zip" "target\installer\$uuid-windows.streamDeckPlugin"
          }

          # Prüfsummen – der Auto-Updater der App installiert nur verifizierte Installer.
          Push-Location target\installer
          Get-ChildItem -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Smoke-Test des Dienstes
        shell: pwsh
        run: |
          $env:RUST_LOG = "debug"
          $p = Start-Process target\release\opendeckn3d.exe -ArgumentList "--virtual","--no-hardware","--plugins-dir","plugins\examples","--config-dir","$env:RUNNER_TEMP\n3cfg" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\daemon.out" -RedirectStandardError "$env:RUNNER_TEMP\daemon.err"
          Start-Sleep -Seconds 3
          node tools/smoke-test.mjs
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP\daemon.out", "$env:RUNNER_TEMP\daemon.err" -Tail 80 }
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDeckN3-${{ steps.version.outputs.version }}-windows-x64
          path: target/installer/*

      # Bei Tag-Push oder manuellem Start mit release_tag. Existiert das Tag noch nicht,
      # legt GitHub es auf dem gebauten Commit an.
      - name: GitHub-Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenDeckN3 ${{ steps.version.outputs.version }}
          files: target/installer/*
          generate_release_notes: true
          # v0.1.0-alpha.1 etc. → als Vorabversion markieren
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
