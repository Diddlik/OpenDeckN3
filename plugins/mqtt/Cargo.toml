[package]
name = "opendeckn3-mqtt"
description = "OpenDeckN3-Plugin: MQTT-Nachrichten senden und Werte anzeigen (Zigbee2MQTT, Tasmota, ioBroker, Node-RED)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opendeckn3-mqtt"
path = "src/main.rs"

[dependencies]
n3-plugin-sdk.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
# Same crypto backend (ring) as the other plugins instead of rumqttc's default aws-lc-rs.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
