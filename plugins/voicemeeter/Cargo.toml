[package]
name = "opendeckn3-voicemeeter"
description = "OpenDeckN3-Plugin: VoiceMeeter (Standard, Banana, Potato) steuern: Pegel, Stumm, Routing und Befehle (nur Windows)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opendeckn3-voicemeeter"
path = "src/main.rs"

[dependencies]
n3-plugin-sdk.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
libloading.workspace = true
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }
