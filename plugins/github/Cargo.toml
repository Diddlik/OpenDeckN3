[package]
name = "opendeckn3-github"
description = "OpenDeckN3-Plugin: GitHub (CI-Status, Pull Requests, Benachrichtigungen) über die GitHub-REST-API"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opendeckn3-github"
path = "src/main.rs"

[dependencies]
n3-plugin-sdk.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
