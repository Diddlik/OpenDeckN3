[package]
name = "opendeckn3-media"
description = "OpenDeckN3-Plugin: Wiedergabe steuern und Titel sowie Cover des laufenden Mediums anzeigen (Windows: SMTC, Linux: MPRIS)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opendeckn3-media"
path = "src/main.rs"

[dependencies]
n3-plugin-sdk.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
image.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
url = "2"
