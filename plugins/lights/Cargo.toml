[package]
name = "opendeckn3-lights"
description = "OpenDeckN3-Plugin: Lampen im lokalen Netz steuern – Elgato Key Light, Philips Hue und WLED (Ein/Aus, Helligkeit, Farbtemperatur, Szenen)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opendeckn3-lights"
path = "src/main.rs"

[dependencies]
n3-plugin-sdk.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
