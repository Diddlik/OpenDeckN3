[package]
name = "opendeckn3-spotify"
description = "OpenDeckN3-Plugin: Spotify (Gefällt mir, Playlist, Zufall, Wiederholen, Gerät) über die Spotify Web API"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opendeckn3-spotify"
path = "src/main.rs"

[dependencies]
n3-plugin-sdk.workspace = true
anyhow.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
sha2 = "0.10"
getrandom = "0.3"
