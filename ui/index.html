<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDeckN3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ Design-Tokens ============ */
:root,[data-theme="dark"]{
  --bg:#0B0D10;--stage:#0E1014;--panel:#121519;--panel2:#171A1F;--raised:#1E2228;--hover:#22262D;
  --line:#2A2F37;--line2:#1F242B;--text:#ECEEF1;--muted:#A0A7B2;--faint:#8A929E;
  --accent:#35E0D0;--accent-ink:#062320;--accent-text:#35E0D0;--accent-soft:rgba(53,224,208,.14);
  --ok:#4ADE80;--warn:#F5B841;--err:#F26D6D;--err-text:#F7A0A0;
  --dot:rgba(255,255,255,.05);--shadow:0 16px 40px rgba(0,0,0,.45);--input:#0E1014;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F4F5F7;--stage:#ECEEF1;--panel:#FFFFFF;--panel2:#FAFAFB;--raised:#EEF0F3;--hover:#E8EBEF;
  --line:#DDE1E6;--line2:#E4E7EB;--text:#14171C;--muted:#545C69;--faint:#69717E;
  --accent:#0B8A80;--accent-ink:#FFFFFF;--accent-text:#0B7F76;--accent-soft:rgba(11,138,128,.12);
  --ok:#15803D;--warn:#A16207;--err:#C42B2B;--err-text:#B42323;
  --dot:rgba(0,0,0,.06);--shadow:0 16px 40px rgba(20,23,28,.12);--input:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ============ Grundbausteine ============ */
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--raised);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{border-color:color-mix(in srgb,var(--err) 45%,transparent);background:color-mix(in srgb,var(--err) 8%,transparent);color:var(--err-text)}
.btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:12px}
.btn.icon{width:40px;padding:0}
.field{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--input);padding:0 12px;font-size:14px;min-width:0}
select.field{padding:0 10px}
.chip{font-size:10px;font-weight:600;letter-spacing:.02em;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.switch{width:46px;height:28px;flex:none;border-radius:999px;border:0;background:var(--line);padding:3px;display:flex}
.switch span{width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .18s ease}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{transform:translateX(18px);background:var(--accent-ink)}
.seg{display:flex;padding:4px;gap:4px;border-radius:12px;background:var(--input);border:1px solid var(--line)}
.seg button{height:32px;padding:0 14px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.seg button[aria-checked="true"]{background:var(--raised);color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.rise{animation:rise .25s ease}
pre.code{margin:0;padding:14px;font-family:'Geist Mono',monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;overflow-x:auto}
.codebox{border-radius:14px;border:1px solid var(--line2);background:var(--panel);overflow:hidden}
.codebox-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line2);font-size:13px;color:var(--muted)}

/* ============ Titelleiste ============ */
.bar{min-height:64px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.ctx .kb{margin-left:auto;padding-left:16px;font-size:11px;color:var(--faint)}
.brand b{color:var(--accent-text);font-weight:600}
.nav{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2)}
.nav button{height:32px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.nav button[aria-current="page"]{background:var(--raised);color:var(--text)}
.bar .grow{flex:1}
.devsel{height:40px;padding:0 10px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:10px;position:relative}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.badge.virt{background:rgba(160,132,255,.16);color:#B9A4FF}
[data-theme="light"] .badge.virt{color:#6D4BD8}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.bright{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:10px;color:#E3B341}
.bright input{width:100px;accent-color:var(--accent)}
.bright output{font-family:'Geist Mono',monospace;font-size:12px;color:var(--text);width:40px;text-align:right}
.popover{position:absolute;top:calc(100% + 6px);right:0;min-width:280px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);box-shadow:var(--shadow);z-index:50}
.popover button{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:8px;background:transparent;text-align:left}
.popover button:hover{background:var(--hover)}
.popover small{display:block;font-family:'Geist Mono',monospace;font-size:11px;color:var(--faint)}

/* ============ Editor-Layout ============ */
.editor{flex:1;display:grid;grid-template-columns:280px minmax(0,1fr) 340px;min-height:0}
@media (max-width:1180px){.editor{grid-template-columns:260px minmax(0,1fr)}.insp{grid-column:1 / -1;border-left:0!important;border-top:1px solid var(--line2)}}
@media (max-width:760px){.editor{grid-template-columns:minmax(0,1fr)}.lib{border-right:0!important;border-bottom:1px solid var(--line2)}}

/* Bibliothek */
.lib{background:var(--panel);border-right:1px solid var(--line2);padding:20px 14px 16px;display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--faint)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:14px;color:var(--text)}
.grp{display:flex;align-items:center;gap:6px;height:32px;width:100%;padding:0 6px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;text-align:left}
.grp svg{transition:transform .15s ease}
.grp[aria-expanded="true"] svg{transform:rotate(90deg)}
.grp .n{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;font-weight:400;color:var(--faint)}
.item{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 8px 6px 4px;border-radius:10px;border:1.5px solid transparent;background:transparent;text-align:left;cursor:grab;user-select:none}
.item:hover{background:var(--hover)}
.item.dragging{border-style:dashed;border-color:var(--accent);opacity:.5}
.item .grip{color:var(--line);display:flex}
.tile{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center}
.item .nm{font-size:14px;font-weight:500}
.item .meta{display:flex;gap:4px;margin-top:4px}

/* Bühne */
.center{padding:24px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
/* Gerät bleibt oben im Bild: die Mitte klebt unter der (ebenfalls festen) Leiste, ist so hoch
   wie der Rest des Fensters und scrollt nicht mit, wenn die Bibliothek links die Seite verlängert. */
@media (min-width:1181px){.center{position:sticky;top:var(--bar-h,64px);align-self:start;height:calc(100vh - var(--bar-h,64px));min-height:620px}
  /* The inspector stays in view too; long settings scroll inside it. */
  .insp{position:sticky;top:var(--bar-h,64px);align-self:start;height:calc(100vh - var(--bar-h,64px));overflow-y:auto;overscroll-behavior:contain}}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
/* Seiten des Profils */
.pages{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:-4px}
.pg{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px 0 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:13px;font-weight:500;max-width:220px}
.pg:hover{background:var(--hover);color:var(--text)}
.pg .n{min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:var(--input);display:inline-flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:11px}
.pg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .c{font-family:'Geist Mono',monospace;font-size:10px;color:var(--faint)}
.pg[aria-selected="true"]{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.pg[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
.pgadd{height:34px;font-size:13px}
.head h1{margin:2px 0 0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.toggle{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:500}
.toggle .switch{width:34px;height:20px;padding:2px}
.toggle .switch span{width:16px;height:16px}
.toggle[aria-pressed="true"] .switch{background:var(--accent)}
.toggle[aria-pressed="true"] .switch span{transform:translateX(14px);background:var(--accent-ink)}
.stage{flex:1;min-height:540px;position:relative;border-radius:20px;border:1px solid var(--line2);background-color:var(--stage);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 16px;overflow:hidden;transition:border-color .2s}
.stage.dragmode{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.hint{display:flex;align-items:center;gap:14px;max-width:460px;padding:14px 18px 14px 14px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow)}
.hint .tile{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text)}
.pill{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:13px;color:var(--muted)}
.status .mono{font-size:12px}

/* Inspektor */
.insp{background:var(--panel);border-left:1px solid var(--line2);padding:24px;display:flex;flex-direction:column;gap:22px}
.insp h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.insp section{display:flex;flex-direction:column;gap:12px}
.insp label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.insp .row{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px}
.empty-card{border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
section.danger{margin-top:auto;padding-top:16px;border-top:1px solid var(--line2)}
section.danger h3{color:var(--err)!important}

/* ============ Gerät (Layout nach Produktfoto) ============ */
.device{--dim:1;width:700px;padding:30px 32px 18px 36px;border-radius:30px;border:1px solid #2E333B;background:linear-gradient(180deg,#23272E 0%,#17191E 100%);box-shadow:0 40px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px;color:#ECEEF1;flex:none;transition:filter .3s,opacity .3s;--well:#191C21;--wellline:#2C3139;--trk:#2A2F37;--lbl:#D7DBE1;--lblEmpty:#8A929E;--sub:#8A929E;--eng:#6B7280}
.device.white{background:linear-gradient(180deg,#F7F8FA 0%,#E3E6EA 100%);border-color:#D3D7DD;box-shadow:0 40px 80px rgba(0,0,0,.35),inset 0 1px 0 #fff;--well:#E9ECEF;--wellline:#D0D4DA;--trk:#C9CED5;--lbl:#2B3038;--lblEmpty:#6B7280;--sub:#5B6370;--eng:#8A929E}
.device.offline{filter:grayscale(1);opacity:.45;pointer-events:none}
.dev-row{display:flex;gap:40px;align-items:stretch}
.dev-left{display:flex;flex-direction:column;gap:22px}
.keys{display:grid;grid-template-columns:repeat(3,96px);gap:14px}
.device.flip .keys .key,.device.flip .rkey,.device.flip .knob{animation:flip .38s ease}
@keyframes flip{0%{transform:perspective(500px) rotateY(0)}50%{transform:perspective(500px) rotateY(90deg);opacity:.2}100%{transform:perspective(500px) rotateY(0)}}
.key{position:relative;width:96px;height:96px;padding:7px;border-radius:16px;border:1px solid #0A0B0D;background:#0F1114;box-shadow:inset 0 -3px 0 rgba(0,0,0,.6),0 3px 6px rgba(0,0,0,.35);transition:transform .12s ease,box-shadow .2s ease,opacity .2s}
.key:hover,.rkey:hover{transform:translateY(1px)}
.key:active,.rkey:active{transform:translateY(2px) scale(.97)}
.screen{width:100%;height:100%;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;filter:brightness(var(--dim));border:1px solid rgba(255,255,255,.05);font-size:11px;font-weight:600;letter-spacing:.02em}
.screen .t{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen .big{font-family:'Geist Mono',monospace;font-size:28px;font-weight:500;line-height:1}
.screen .small{font-size:10px;font-weight:500;opacity:.8}
.screen.empty{background:#0E1014;color:#5B6370;border:1.5px dashed #2F353E}
.rkeys{display:grid;grid-template-columns:repeat(3,96px);gap:14px;justify-items:center}
.rkey-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.rkey{position:relative;width:62px;height:62px;border-radius:50%;border:1px solid #0A0B0D;background:radial-gradient(circle at 50% 32%,#3E434C 0%,#1C1F24 62%,#121418 100%);box-shadow:0 0 0 7px var(--well),0 0 0 8px var(--wellline),0 6px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#ECEEF1;transition:transform .12s ease,box-shadow .2s}
.rkey.isempty{color:#6B7280}
.rlabel{font-size:11px;font-weight:500;color:var(--lbl);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlabel.e{color:var(--lblEmpty)}
.dev-right{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px}
.knob-row{display:flex;gap:40px}
.knob-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.knob-btn{position:relative;padding:0;border:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s}
.knob-btn svg{position:absolute;inset:0;width:100%;height:100%}
.knob-btn .trk,.knob-btn .val{fill:none;stroke-linecap:round}
.knob-btn .trk{stroke:var(--trk)}
.knob-btn .val{stroke:#35E0D0;transition:stroke-dasharray .15s ease}
.knob{position:relative;border-radius:50%;background-color:#16181C;background-image:repeating-conic-gradient(rgba(255,255,255,.05) 0deg 3deg,transparent 3deg 6deg),conic-gradient(from 210deg,#101215,#3A3F47,#15171B,#2E333A,#101215);display:flex;justify-content:center;transition:transform .15s ease}
.knob i{display:block;width:3px;border-radius:2px;background:#ECEEF1}
.big .knob-btn{width:176px;height:176px}
.big .knob{width:140px;height:140px;box-shadow:0 14px 28px rgba(0,0,0,.6),inset 0 0 0 6px #0C0D10,inset 0 1px 0 rgba(255,255,255,.15)}
.big .knob i{margin-top:12px;height:20px}
.big svg circle{stroke-width:3}
.small .knob-btn{width:92px;height:92px}
.small .knob{width:66px;height:66px;box-shadow:0 8px 14px rgba(0,0,0,.6),inset 0 0 0 4px #0C0D10,inset 0 1px 0 rgba(255,255,255,.15)}
.small .knob i{margin-top:7px;height:12px}
.small svg circle{stroke-width:5}
.knob-wrap.isempty .knob i{background:#4B5260}
.klabel{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--lbl);white-space:nowrap}
.klabel.e{color:var(--lblEmpty)}
.ksub{font-family:'Geist Mono',monospace;font-size:11px;color:var(--sub);height:14px;white-space:nowrap}
.engrave{display:flex;justify-content:space-between;align-items:center;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--eng)}
.led{width:6px;height:6px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px #4ADE80}
.device.offline .led{background:#F5B841;box-shadow:0 0 8px #F5B841}
/* Slot-Zustände */
.key::after,.rkey::after,.knob-btn::after{content:"";position:absolute;pointer-events:none;border-radius:inherit;border:2px solid transparent;transition:border-color .15s,background .15s,box-shadow .2s}
.key::after{inset:-6px;border-radius:20px}
.rkey::after{inset:-12px}
.knob-btn::after{inset:-4px}
.sel::after{border-color:#35E0D0}
.target::after{border-color:rgba(53,224,208,.75);border-style:dashed}
.replace::after{border-color:rgba(53,224,208,.3);border-style:dashed}
.over::after{border-color:#35E0D0;background:rgba(53,224,208,.14);box-shadow:0 0 32px rgba(53,224,208,.5)}
.disabled{opacity:.28}
.dim{opacity:.4;transition:opacity .15s}.dim:hover{opacity:.55}
.locked{cursor:not-allowed}
.libmode{width:100%}.libmode button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px}
.press{box-shadow:0 0 0 2px #35E0D0,0 0 30px rgba(53,224,208,.55)!important}
.device-outline{width:700px;height:404px;border-radius:30px;border:2px dashed var(--line);padding:34px 36px;display:flex;gap:56px;flex:none}
.device-outline span{border:2px dashed var(--line);display:block}
@media (max-width:1460px){.stage .device,.stage .device-outline{zoom:.86}}
@media (max-width:1300px){.stage .device,.stage .device-outline{zoom:.74}}
@media (max-width:760px){.device,.device-outline{zoom:.48}}

/* ============ Seiten ============ */
.page{flex:1;display:flex;flex-wrap:wrap;align-items:stretch}
.page-main{flex:999 1 560px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.page h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.pstatus{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--input);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.gset{display:flex;flex-direction:column;gap:12px}.gset h3{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.gset label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.gset .help{font-size:12px;color:var(--faint);line-height:1.45}
.ginfo.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--input))}
.ginfo.err{border-color:color-mix(in srgb,var(--err) 45%,var(--line));background:color-mix(in srgb,var(--err) 7%,var(--input))}
.ginfo.busy{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.ginfo span{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cstate{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.cstate .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.cstate.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.cstate.err{color:var(--err-text);background:color-mix(in srgb,var(--err) 14%,transparent)}
.cstate.busy{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.cstate.busy .dot{animation:pulse 1s ease-in-out infinite}
.ginfo{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--input);border:1px solid var(--line);font-size:12px;color:var(--muted)}.ginfo b{font-size:14px;color:var(--text);font-weight:500}
.combo{position:relative;flex:1;min-width:0;display:flex}.combo>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.combo .field{flex:1;padding-left:34px}
.ghform{display:flex;gap:10px;flex-wrap:wrap}.ghform .field{flex:1 1 260px}
.scard{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;border:1px solid var(--line2);background:var(--panel)}
.scard p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.dropzone{outline:2px dashed var(--accent);outline-offset:-10px;border-radius:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:16px;padding:18px;border-radius:16px;border:1px solid var(--line2);background:var(--panel);text-align:left;transition:border-color .15s,transform .15s}
.pcard:hover{transform:translateY(-1px);border-color:var(--line)}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.state{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:13px}
.state.on{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.state.off{background:color-mix(in srgb,var(--faint) 15%,transparent);color:var(--muted)}
.detail{flex:1 1 380px;min-width:0;background:var(--panel);border-left:1px solid var(--line2);padding:28px;display:flex;flex-direction:column;gap:22px}
.detail dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 12px;font-size:13px}
.detail dt{color:var(--faint)} .detail dd{margin:0;overflow-wrap:anywhere}
.arow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2)}
.settings{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:32px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:32px}
.snav{flex:1 1 200px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(var(--bar-h,64px) + 16px)}
.snav a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.snav a:hover{background:var(--raised);color:var(--text)}
.sbody{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:20px}
.scard{border-radius:16px;border:1px solid var(--line2);background:var(--panel);scroll-margin-top:calc(var(--bar-h,64px) + 16px)}
.scard h2{margin:0;padding:18px 20px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line2)}
.srow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.srow:last-child{border-bottom:0}
.srow .t{display:flex;flex-direction:column;gap:3px}
.srow .t b{font-size:14px;font-weight:500}
.srow .t span{font-size:13px;color:var(--muted)}
.blank{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}

/* Onboarding */
.ob{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.ob-card{width:100%;max-width:1180px;border-radius:24px;border:1px solid var(--line2);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.steps{margin:0;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:20px 28px;border-bottom:1px solid var(--line2)}
.steps li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--faint)}
.steps li.on,.steps li.done{color:var(--text)}
.steps .num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:13px;border:1px solid var(--line)}
.steps li.on .num{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
.steps li.done .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps .ln{width:48px;height:1px;background:var(--line)}
.ob-body{display:flex;flex-wrap:wrap;align-items:center;gap:40px;padding:44px 40px}
.ob-body .txt{flex:1 1 340px;display:flex;flex-direction:column;gap:18px}
.ob-body h1{margin:0;font-size:36px;line-height:1.12;font-weight:600;letter-spacing:-.025em}
.ob-body p{margin:0;font-size:16px;line-height:1.6;color:var(--muted)}
.ob-body .dev{flex:0 1 auto;margin:0 auto}
.ob-body .dev .device{zoom:.82}
@media (max-width:760px){.ob-body .dev .device{zoom:.48}}

/* Toast, Menüs, Dialog */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14px;white-space:nowrap;animation:rise .22s ease}
.toast .ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bg)}
.ctx{position:fixed;min-width:200px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);box-shadow:var(--shadow);z-index:90;animation:rise .12s ease}
.ctx button{width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:14px;text-align:left}
.ctx button:hover:not(:disabled){background:var(--hover)}
.ctx button:disabled{color:var(--faint);cursor:default}
.ctx button.red{color:var(--err-text)}
.ctx hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:95;padding:16px;animation:rise .15s ease}
.dialog{width:100%;max-width:420px;border-radius:18px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px}
.dialog h2{margin:0;font-size:18px;font-weight:600}
.icondlg{max-width:560px}
.swrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.swrow span{width:84px}
.swatch{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);padding:0}

.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;max-height:min(46vh,340px);overflow-y:auto;padding:2px}
.icongrid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;padding:0}
.icongrid button:hover,.icongrid button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{font-size:13px;color:var(--err-text)}
/* ============ Ergänzungen für die Live-Anbindung ============ */
.screen.img{position:relative;padding:0;background:#000}
.screen.img img{width:100%;height:100%;object-fit:cover;display:block}

.tile img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
textarea.field{height:auto;min-height:140px;padding:10px 12px;font-family:'Geist Mono',monospace;font-size:12.5px;line-height:1.6;resize:vertical}
.linkbtn{border:0;background:transparent;padding:0;font-family:'Geist Mono',monospace;font-size:12px;color:var(--accent-text)}
.help{font-size:12px;line-height:1.45;color:var(--faint)}
.fieldrow{display:flex;gap:8px;align-items:center}.fieldrow .field{flex:1;min-width:0}
[data-type="shortcut"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.notes{max-height:220px;overflow:auto;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-size:13px;line-height:1.55;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden}

.fieldwrap{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}

.hotkey .ph{font-size:13px;color:var(--faint)}
.hotkey.rec .ph{color:var(--accent-text)}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 9px;border-radius:8px;border:1px solid var(--line);border-bottom-width:3px;background:var(--raised);color:var(--text);font-family:'Geist Mono',monospace;font-size:12.5px;font-weight:500}
.caps .plus{color:var(--faint);font-size:12px}
.soon{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--raised);color:var(--faint)}

/* =====================================================================
   API-Client (ws://127.0.0.1:<port>, siehe docs/UI_API.md)
   ===================================================================== */
const api = {
  ws: null, nextId: 1, pending: new Map(), retry: null,
  connect() {
    clearTimeout(this.retry);
    if (this.ws) { this.ws.onclose = null; this.ws.close(); }
    let ws;
    try { ws = new WebSocket(`ws://127.0.0.1:${S.port}`); } catch { this.lost(); return; }
    this.ws = ws;
    ws.onopen = () => { S.conn = 'online'; refresh(); };
    ws.onclose = () => this.lost();
    ws.onmessage = (m) => {
      let msg; try { msg = JSON.parse(m.data); } catch { return; }
      if (msg.id != null && this.pending.has(msg.id)) {

    };
  },
  lost() {
    this.ws = null;
    for (const { reject } of this.pending.values()) reject(new Error('Verbindung zum Dienst verloren'));
    this.pending.clear();
    const was = S.conn; S.conn = 'offline';
    for (const [id, d] of Object.entries(S.devices)) S.lost[id] = d;
    S.devices = {};
    if (was !== 'offline') render();
    this.retry = setTimeout(() => this.connect(), 5000);
  },
  call(command, params = {}) {
    return new Promise((resolve, reject) => {
      if (!this.ws || this.ws.readyState !== WebSocket.OPEN) { reject(new Error('Dienst nicht verbunden')); return; }
      const id = this.nextId++;
      this.pending.set(id, { resolve, reject });
      this.ws.send(JSON.stringify({ id, command, ...params }));
    });
  },
  // Wie call, zeigt Fehler aber direkt als Toast an.
  run(command, params) { return this.call(command, params).catch((e) => { toast('err', e.message); throw e; }); }
};
const slotParams = (id) => { const { p, ctl } = parseId(id); return { device: S.devId, controller: ctl, position: p }; };

async function refresh() {

    S.devices = {};
    for (const d of st.devices) { adopt(d); delete S.lost[d.info.id]; }
    S.catalog = st.catalog;
    S.appVersion = S.appVersion || st.version;
    api.call('getAppSettings').then((v) => { S.appSettings = v; if (S.route === 'settings') render(); }).catch(() => {});
    if (!S.pluginSel || !S.catalog.some((p) => p.uuid === S.pluginSel)) S.pluginSel = S.catalog[0] && S.catalog[0].uuid;

function onEvent(ev) {

      render(); break;
    }
    case 'deviceDisconnected': {
      const d = S.devices[ev.device]; if (!d) break;
      S.lost[ev.device] = d; delete S.devices[ev.device];

  encs: [0, 1, 2].map((p) => ({ id: 'e' + p, pos: p, empty: true, label: 'Frei', sub: '', value: null }))
});

function deviceHTML(v, o = {}) {
  const cls = ['device'];
  if (S.finish === 'weiss') cls.push('white');
  if (o.offline) cls.push('offline');
  if (o.flip) cls.push('flip');
  const st = (x) => {
    const c = [];
    if (o.sel === x.id && !o.dragCtl) c.push('sel');
    // Modus „Drehregler“: Tasten sind gesperrt. Modus „Tasten“: alles belegbar (Regler = Taste).
    if (o.mode === 'Encoder' && x.id[0] === 'k') c.push('dim', 'locked');
    if (o.pressed === x.id) c.push('press');
    if (o.dragCtl) {
      const ok = o.dragCtl.includes(x.id[0] === 'k' ? 'Keypad' : 'Encoder');
      if (!ok) c.push('disabled'); else if (o.over === x.id) c.push('over'); else c.push(x.empty ? 'target' : 'replace');
    }
    return c.join(' ');
  };
  const at = (x) => o.interactive ? `data-slot="${x.id}" aria-pressed="${o.sel === x.id}"${x.empty ? '' : ' draggable="true"'}` : 'tabindex="-1"';
  const aria = (x, what) => `${what} ${slotShort(x.id)}${x.empty ? ', frei' : ', ' + (x.title || x.label)}`;

  const dk = (x) => {
    let inner;
    if (x.empty) inner = `<span class="screen empty">${ic('plus', 22)}</span>`;
    else if (x.img) inner = `<span class="screen img"><img src="${esc(x.img)}" alt=""></span>`;
    else {
      const c = KCOL[x.kind] || KCOL.key;
      const glyph = x.icon ? `<img src="${esc(x.icon)}" alt="" style="width:30px;height:30px">` : ic(x.kind, 26);
      inner = `<span class="screen" style="background:${c[0]};color:${c[1]}">${glyph}<span class="t">${esc(x.title)}</span></span>`;
    }
    return `<button type="button" class="key ${st(x)}" ${at(x)} aria-label="${esc(aria(x, 'Display-Taste'))}">${inner}</button>`;
  };
  const rk = (x) => `<div class="rkey-wrap"><button type="button" class="rkey ${x.empty ? 'isempty' : ''} ${st(x)}" ${at(x)} aria-label="${esc(aria(x, 'Taste'))}">${x.empty ? ic('plus', 16) : ic(x.kind, 18)}</button><span class="rlabel ${x.empty ? 'e' : ''}">${esc(x.empty ? x.id.toUpperCase() : x.title)}</span></div>`;
  const kn = (x, size) => {
    const val = x.value;
    const dash = val == null ? '0 400' : (235.6 * val / 100).toFixed(1) + ' 400';
    const rot = val == null ? 0 : -135 + 270 * val / 100;
    return `<div class="knob-wrap ${size} ${x.empty ? 'isempty' : ''}">
      <button type="button" class="knob-btn ${st(x)}" ${at(x)} ${o.interactive ? `data-enc="${x.pos}"` : ''} aria-label="${esc(aria(x, isKnobKey(x.id) ? 'Drehregler drücken' : 'Drehregler drehen'))}">
        <svg viewBox="0 0 108 108" aria-hidden="true"><circle class="trk" cx="54" cy="54" r="50" stroke-dasharray="235.6 400" transform="rotate(135 54 54)"/><circle class="val" cx="54" cy="54" r="50" stroke-dasharray="${dash}" transform="rotate(135 54 54)"/></svg>
        <span class="knob" style="transform:rotate(${rot}deg)"><i></i></span>
      </button>
      <div class="klabel ${x.empty ? 'e' : ''}">${x.empty ? '' : ic(x.kind, 13)}${esc(x.label)}</div>
      <div class="ksub">${esc(x.sub)}</div>
    </div>`;
  };
  const k = v.keys, e = o.mode === 'Keypad' && v.knobKeys ? v.knobKeys : v.encs;
  const bri = o.brightness ?? 100;
  return `<div class="${cls.join(' ')}" style="--dim:${(0.4 + 0.6 * bri / 100).toFixed(2)}" role="group" aria-label="TreasLin N3">
    <div class="dev-row">
      <div class="dev-left">
        <div class="keys">${k.slice(0, 6).map(dk).join('')}</div>
        <div class="rkeys">${k.slice(6).map(rk).join('')}</div>
      </div>
      <div class="dev-right">${kn(e[1], 'big')}<div class="knob-row">${kn(e[0], 'small')}${kn(e[2], 'small')}</div></div>
    </div>
    <div class="engrave"><span>TREASLIN · N3</span><span class="led"></span></div>
  </div>`;
}

        <span class="dot ${dev === 'none' || dev === 'connecting' ? 'pulse' : ''}" style="background:${dot};box-shadow:0 0 10px ${dot}"></span>
        <span style="font-weight:500">${esc(name)}</span>
        ${dev === 'virtual' ? '<span class="badge virt">Virtuell</span>' : ''}
        ${dev === 'disconnected' ? '<span class="badge warn">Getrennt</span>' : ''}
        <span style="color:var(--faint);display:flex">${ic('chevron', 16)}</span>
      </button>
      ${S.popover === 'dev' ? `<div class="popover" role="menu">
        ${Object.values(S.devices).map((x) => devItem(x, false)).join('')}
        ${Object.values(S.lost).map((x) => devItem(x, true)).join('')}
        ${hasVirtual ? '' : `<button type="button" role="menuitem" data-act="startVirtual">${ic('play', 16)}<span>Virtuelles Gerät starten<small>virtual-n3 · ohne Hardware testen</small></span></button>`}
      </div>` : ''}
    </div>
    <div style="display:flex;align-items:center;gap:6px;${off ? 'opacity:.4' : ''}">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">Profil
        <select class="field" data-in="profile" ${off ? 'disabled' : ''} style="min-width:140px;font-weight:500;background:var(--panel2)">
          ${profiles.map((id) => `<option value="${esc(id)}" ${d && id === d.activeProfile ? 'selected' : ''}>${esc(id)}</option>`).join('')}

      <button type="button" class="btn icon" data-act="newProfile" aria-label="Neues Profil" title="Neues Profil" ${off ? 'disabled' : ''} style="background:var(--panel2)">${ic('plus', 18)}</button>
      <button type="button" class="btn icon" data-act="copyProfile" aria-label="Profil kopieren" title="Aktives Profil kopieren" ${off ? 'disabled' : ''} style="background:var(--panel2)">${ic('duplicate', 17)}</button>
      <button type="button" class="btn icon" data-act="deleteProfile" aria-label="Profil löschen" title="Aktives Profil löschen" ${off || profiles.length < 2 ? 'disabled style="background:var(--panel2);opacity:.45"' : 'style="background:var(--panel2)"'}>${ic('trash', 17)}</button>
    </div>
    <label class="bright" style="${off ? 'opacity:.4' : ''}">${ic('brightness', 17)}<span class="sr">Helligkeit</span>
      <input type="range" min="0" max="100" value="${bri}" data-in="brightness" ${off ? 'disabled' : ''}>
      <output>${bri} %</output>
    </label>
    ${S.update ? `<button type="button" class="updbtn" data-act="showUpdate" title="OpenDeckN3 ${esc(S.update.version)} ist verfügbar">${ic('arrow', 15)}Update</button>` : ''}
    <button type="button" class="btn icon" data-act="nav" data-arg="settings" aria-label="Einstellungen" aria-current="${S.route === 'settings' ? 'page' : 'false'}" style="background:var(--panel2);${S.route === 'settings' ? 'color:var(--accent-text)' : ''}">${ic('gear', 18)}</button>

}

// Bibliotheks-Modus folgt dem gewählten Slot: Taste → Tasten-Aktionen, Drehregler → Drehregler-Aktionen.
const libMode = () => parseId(S.sel).ctl;
const lastSel = { Keypad: 'k0', Encoder: 'e1' };

function libListHTML() {
  const q = S.q.trim().toLowerCase();
  let hits = 0;
  const html = S.catalog.map((p) => {
    const mode = libMode();
    const items = p.actions.filter((a) => ctlOf(a).includes(mode) && (!q || a.name.toLowerCase().includes(q) || (a.tooltip || '').toLowerCase().includes(q)));
    if (!items.length) return '';
    hits += items.length;
    const open = !S.closed[p.uuid] || !!q;
    return `<div>
      <button type="button" class="grp" data-act="group" data-arg="${esc(p.uuid)}" aria-expanded="${open}">${ic('chevronRight', 14)}<span>${esc(p.name)}</span><span class="n">${items.length}</span></button>
      ${open ? items.map((a) => {
        const key = actKey(p.uuid, a.uuid);
        return `<div class="item ${S.drag === key ? 'dragging' : ''}" draggable="true" data-pick="${esc(key)}" role="button" tabindex="0" title="${esc(p.connected ? (a.tooltip || a.name) : 'Plugin läuft nicht')}">
          <span class="grip">${ic('grip', 14)}</span>
          ${tileHTML(p.uuid, a.uuid, a.icon, 34, 18)}
          <span style="flex:1;min-width:0"><span class="nm">${esc(a.name)}</span>
            <span class="meta">${ctlOf(a).map((c) => `<span class="chip">${c === 'Keypad' ? 'Taste' : 'Drehregler'}</span>`).join('')}</span></span>
          ${p.connected ? '' : '<span class="dot" style="background:var(--faint)" aria-label="Plugin läuft nicht"></span>'}
        </div>`;
      }).join('') : ''}
    </div>`;
  }).join('');
  return html + (hits ? '' : `<div style="padding:16px 8px;font-size:13px;color:var(--faint)">${!S.catalog.length ? 'Noch keine Aktionen geladen.' : S.q.trim() ? 'Keine Aktion gefunden.' : libMode() === 'Encoder' ? 'Keine Aktionen für Drehregler.' : 'Keine Aktionen für Tasten.'}</div>`);
}

function libraryHTML() {
  const mode = libMode();
  lastSel[mode] = S.sel;
  const modeBtn = (m, icon, label) => `<button type="button" role="radio" aria-checked="${mode === m}" data-act="libMode" data-arg="${m}">${ic(icon, 15)}${label}</button>`;
  return `<aside class="lib" aria-label="Aktionsbibliothek">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 6px">
      <span class="label">Aktionen</span>
      <span style="font-size:12px;color:var(--muted)">Ziel <span class="mono" style="color:var(--accent-text)">${esc(slotShort(S.sel))}</span></span>
    </div>
    <div class="seg libmode" role="radiogroup" aria-label="Aktionen anzeigen für">${modeBtn('Keypad', 'key', 'Tasten')}${modeBtn('Encoder', 'dial', 'Drehregler')}</div>
    <label class="search">${ic('search', 16)}<input type="search" placeholder="Aktion suchen" aria-label="Aktion suchen" value="${esc(S.q)}" data-in="q"></label>
    <div id="liblist" style="flex:1;display:flex;flex-direction:column;gap:6px">${libListHTML()}</div>
    <button type="button" class="btn" data-act="nav" data-arg="plugins" style="border-style:dashed;background:transparent;color:var(--muted)">${ic('plug', 16)}Plugins verwalten</button>
  </aside>`;
}

function stageInner() {
  const d = cur(); if (!d) return '';
  const P = d.profile;
  const emptyProfile = !Object.keys(P.keys).length && !Object.keys(P.encoders).length;
  const dragAct = S.drag && !S.drag.startsWith('slot:') && actionByKey(S.drag);
  let top = '';
  if (dragAct) {
    const c = ctlOf(dragAct.a);
    top = `<div class="pill">${ic('info', 15)}<span><b style="color:var(--text);font-weight:500">${esc(dragAct.a.name)}</b> passt auf ${c.length === 2 ? 'Tasten und Drehregler' : c[0] === 'Keypad' ? 'Tasten – Drehregler sind gesperrt' : 'Drehregler – Tasten sind gesperrt'}</span></div>`;
  } else if (emptyProfile && isLive()) {
    top = `<div class="hint rise"><span class="tile">${ic('grip', 20)}</span><span style="display:flex;flex-direction:column;gap:3px"><b style="font-size:15px;font-weight:600">Ziehe eine Aktion auf eine Taste</b><span style="font-size:13px;color:var(--muted);line-height:1.45">Oder wähle einen Slot und klicke links auf eine Aktion.</span></span></div>`;
  }
  return top + deviceHTML(viewSlots(d), {
    interactive: true, sel: S.sel, mode: libMode(), pressed: S.pressed, dragCtl: dragAct ? ctlOf(dragAct.a) : null, over: S.over,
    offline: devState() === 'disconnected', flip: S.flip, brightness: d.brightness
  });
}

// Formular aus dem settingsSchema einer Aktion (eingebaute Aktionen, künftig auch Plugins).
// Feld nur zeigen, wenn alle Bedingungen in showIf erfüllt sind (Werte inkl. Standardwerten).
const shown = (f, schema, vals) => !f.showIf || Object.entries(f.showIf).every(([k, want]) => {
  const dflt = (schema.find((x) => x.key === k) || {}).default;
  return String(vals[k] ?? dflt ?? '') === String(want);
});

// Auswahlliste, deren Einträge das Plugin liefert (schema: source, dependsOn).
// Suchfeld mit Autovervollständigung; die Einträge liefert das Plugin bzw. der Dienst.
// Tippen filtert (auch mitten im Namen), Auswahl übernimmt den Wert des Eintrags.
let comboSeq = 0;
function sourceSelectHTML(plugin, f, vals, at, texts = {}) {
  const k = plugin + '|' + f.source + '|' + (f.dependsOn || []).map((d) => vals[d] ?? '').join('|');
  const st = S.popts[k];
  if (!st) loadOptions(plugin, f, vals, k);
  const v = vals[f.key] ?? '';
  const missingDep = (f.dependsOn || []).some((d) => !vals[d]);
  const opts = st && st.options ? st.options : [];
  // Ohne Wert bleibt das Feld leer: ein Text wie „– keine Entität –“ würde die Vorschlagsliste darauf einschränken.
  const hit = v === '' ? null : opts.find(([val]) => String(val) === String(v));
  const shown = hit ? hit[1] : v && !texts.custom ? String(v) : '';
  const placeholder = missingDep ? 'Erst oben auswählen …' : !st || st.loading ? 'Lade …'
    : !opts.length ? 'Keine Einträge' : v && !hit && texts.custom ? texts.custom : (texts.choose || 'Tippen zum Suchen …');
  const id = 'dl' + (++comboSeq);
  const input = `<span class="fieldrow"><span class="combo">${ic('search', 16)}<input class="field" list="${id}" data-in="combo"
      data-key="${esc(f.key)}" data-type="${esc(texts.type || 'select')}" data-src="${esc(k)}" value="${esc(shown)}"
      placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false" ${missingDep && !v ? 'disabled' : ''}
      title="${opts.length} Einträge – tippen zum Filtern"></span>
    <datalist id="${id}">${opts.map(([, l]) => `<option value="${esc(l)}"></option>`).join('')}</datalist>
    <button type="button" class="btn icon" data-act="reloadOptions" data-arg="${esc(k)}" aria-label="Liste neu laden" title="Liste neu laden">${ic('refresh', 16)}</button></span>`;
  const err = st && st.error ? `<span class="help" style="color:var(--err-text)">${esc(st.error)}</span>` : '';
  const missing = v && st && st.options && !hit && !texts.custom && !st.loading
    ? `<span class="help" style="color:var(--warn)">Aktueller Wert „${esc(v)}“ ist nicht (mehr) in der Liste.</span>` : '';
  return input + err + missing;
}
async function loadOptions(plugin, f, vals, k) {
  if ((f.dependsOn || []).some((d) => !vals[d])) { S.popts[k] = { options: [] }; return; }
  S.popts[k] = { loading: true };
  const payload = { request: f.source };
  for (const d of f.dependsOn || []) payload[d] = vals[d];
  try { const r = await api.call('pluginRequest', { plugin, payload }); S.popts[k] = { options: r.options || [] }; }
  catch (e) { S.popts[k] = { error: e.message, options: [] }; }
  render();
}

function schemaFormHTML(s, schema) {
  const d = cur();
  const ctl = parseId(S.sel).ctl;
  const fields = schema.filter((f) => (!f.controllers || f.controllers.includes(ctl)) && shown(f, schema, s.settings));
  if (!fields.length) return '<div style="font-size:13px;color:var(--faint)">Keine Einstellungen nötig.</div>';
  return fields.map((f) => {
    const v = s.settings[f.key] ?? f.default ?? '';
    const at = `data-in="sfield" data-key="${esc(f.key)}" data-type="${esc(f.type)}"`;
    const ph = f.placeholder ? `placeholder="${esc(f.placeholder)}"` : '';
    let input;
    switch (f.type) {
      case 'select':
        if (f.source) { input = sourceSelectHTML(s.plugin, f, s.settings, at); break; }
        input = `<select class="field" ${at}>${f.options.map(([val, l]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
        break;
      case 'profile': {
        const list = d.profiles.includes(v) || !v ? d.profiles : [v, ...d.profiles];
        input = `<select class="field" ${at}><option value="" ${v ? '' : 'selected'} disabled>Profil wählen …</option>${list.map((id) => `<option ${id === v ? 'selected' : ''}>${esc(id)}</option>`).join('')}</select>`;
        break;
      }
      case 'page': {
        const pages = d.pages || [];
        const n = Math.max(1, +v || 1);
        input = `<select class="field" ${at}>${pages.map((p, i) => `<option value="${i + 1}" ${i + 1 === n ? 'selected' : ''}>${i + 1} · ${esc(pageName(d, i))}</option>`).join('')}
          ${n > pages.length ? `<option value="${n}" selected>${n} · (gibt es nicht)</option>` : ''}</select>`;
        break;
      }
      case 'number':
        input = `<input class="field" type="number" ${at} value="${esc(v)}" min="${f.min ?? ''}" max="${f.max ?? ''}">`;
        break;
      case 'shortcut': {
        // Recorder statt Textfeld: Kombination wird per Tastendruck festgelegt.
        const rec = S.rec === f.key;
        const caps = rec
          ? (S.recPreview ? capsHTML(S.recPreview) + '<span class="ph">+ …</span>' : '<span class="ph pulse">Drücke jetzt die Tastenkombination …</span>')
          : v ? capsHTML(String(v)) : '<span class="ph">Hier klicken und Tasten drücken</span>';
        const buttons = rec
          ? `<button type="button" class="btn ghost" data-act="cancelRec">Abbrechen</button>`
          : `<button type="button" class="btn" data-act="startRec" data-arg="${esc(f.key)}">${ic('keyboard', 16)}${v ? 'Neu aufnehmen' : 'Aufnehmen'}</button>${v
            ? `<button type="button" class="btn icon" data-act="clearField" data-arg="${esc(f.key)}" aria-label="Leeren" title="Leeren">${ic('x', 16)}</button>` : ''}`;
        // Das ganze Feld ist der Recorder: anklicken (oder per Tab fokussieren) und Tasten drücken.
        return `<div class="fieldwrap">${esc(f.label)}<div class="hotkey ${rec ? 'rec' : ''}" tabindex="0" role="button" data-act="startRec" data-arg="${esc(f.key)}" aria-label="${esc(f.label)} – klicken und Tasten drücken">
          <div class="caps" aria-live="polite">${caps}</div><div class="hk-actions">${buttons}</div></div>${f.help ? `<span class="help">${esc(f.help)}</span>` : ''}</div>`;
      }
      case 'file':
        // Optional: Auswahlliste (z. B. installierte Programme) über dem Pfadfeld.
        input = (f.source ? sourceSelectHTML(s.plugin, f, s.settings, '',
          { type: 'pick', choose: 'Installiertes Programm suchen …', custom: 'Eigener Pfad (siehe unten) – oder Programm suchen …' }) : '') + `<span class="fieldrow"><input class="field mono" ${at} value="${esc(v)}" ${ph} spellcheck="false">${desktop
          ? `<button type="button" class="btn" data-act="browseFile" data-arg="${esc(f.key)}">${ic('folder', 16)}Durchsuchen …</button>` : ''}</span>`;
        break;
      case 'textarea':
        input = `<textarea class="field" ${at} ${ph} rows="3" style="min-height:84px;font-family:inherit">${esc(v)}</textarea>`;
        break;
      default:
        input = `<input class="field" ${at} value="${esc(v)}" ${ph} spellcheck="false">`;
    }
    return `<label>${esc(f.label)}${input}${f.help ? `<span class="help">${esc(f.help)}</span>` : ''}</label>`;
  }).join('');
}

// Verbindungsstatus eines Plugins mit eigenen Einstellungen (z. B. Discord) direkt im Inspektor.
function pluginStatusHTML(p) {
  if (!S.gset || S.gset.plugin !== p.uuid) { loadGlobalSettings(p.uuid); return ''; }
  const status = S.gset.values.status;
  if (!status) return '';
  const ok = /^verbunden/i.test(status);
  const connect = p.globalSettingsSchema.find((f) => f.type === 'button' && f.primary);

function globalSettingsHTML(p) {
  if (!S.gset || S.gset.plugin !== p.uuid) { loadGlobalSettings(p.uuid); return '<section class="gset"><h3>Einstellungen</h3><div style="color:var(--muted);font-size:13px">Lade …</div></section>'; }
  const vals = S.gset.values;
  const fields = p.globalSettingsSchema.filter((f) => shown(f, p.globalSettingsSchema, vals)).map((f) => {
    const v = vals[f.key] ?? f.default ?? '';
    const at = `data-in="gfield" data-key="${esc(f.key)}"`;
    const help = f.help ? `<span class="help">${esc(f.help)}</span>` : '';
    switch (f.type) {
      case 'info': {
        if (!v) return '';
        const k = statusKind(v);
        return `<div class="ginfo ${k}"><span>${esc(f.label)}${f.key === 'status' ? statusBadge(v) : ''}</span><b>${esc(v)}</b></div>`;
      }
      case 'link':
        return `<a class="btn ghost" href="${esc(f.url)}" target="_blank" rel="noopener">${ic('external', 16)}${esc(f.label)}</a>`;
      case 'button':
        return `<button type="button" class="btn ${f.primary ? 'primary' : ''}" data-act="gbutton" data-arg="${esc(f.key)}">${ic(f.primary ? 'plug' : 'refresh', 16)}${esc(f.label)}</button>${help}`;
      case 'select':
        return `<label>${esc(f.label)}<select class="field" ${at}>${f.options.map(([val, l]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${help}</label>`;
      case 'textarea':
        return `<label>${esc(f.label)}<textarea class="field" ${at} rows="4" style="min-height:96px" spellcheck="false" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>${esc(v)}</textarea>${help}</label>`;
      case 'password':
        return `<label>${esc(f.label)}<input class="field mono" type="password" ${at} value="${esc(v)}" autocomplete="off" spellcheck="false">${help}</label>`;
      default:
        return `<label>${esc(f.label)}<input class="field mono" ${at} value="${esc(v)}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} autocomplete="off" spellcheck="false">${help}</label>`;
    }
  }).join('');
  return `<section class="gset"><h3>Einstellungen</h3>${fields}</section>`;
}
async function loadGlobalSettings(plugin) {
  // Läuft schon ein Abruf, danach noch einmal laden – sonst ginge eine neuere Änderung (z. B. „Verbunden“) verloren.
  if (S.gsetLoading === plugin) { S.gsetAgain = plugin; return; }
  S.gsetLoading = plugin;
  try {
    const values = await api.call('getGlobalSettings', { plugin });
    S.gset = { plugin, values };
    S.pstatus[plugin] = values.status || '';
  } catch { S.gset = { plugin, values: {} }; }
  S.gsetLoading = null;
  if (S.gsetAgain === plugin) { S.gsetAgain = null; return loadGlobalSettings(plugin); }
  renderKeepingFocus();
}
// Verbindungsstatus eines Plugins einordnen: ok / busy / err.
const statusKind = (t) => /^verbunden/i.test(t || '') ? 'ok' : /^verbinde|…$/i.test(t || '') ? 'busy' : t ? 'err' : '';
const statusBadge = (t) => {
  const k = statusKind(t); if (!k) return '';
  const label = k === 'ok' ? 'Verbunden' : k === 'busy' ? 'Verbinde …' : 'Nicht verbunden';
  return `<span class="cstate ${k}"><span class="dot"></span>${label}</span>`;
};
// Status aller Plugins mit eigenen Einstellungen (für die Karten auf der Plugins-Seite).
async function loadPluginStatuses() {
  for (const p of S.catalog.filter((x) => x.globalSettingsSchema && x.connected)) {
    try { S.pstatus[p.uuid] = (await api.call('getGlobalSettings', { plugin: p.uuid })).status || ''; } catch { /* egal */ }
  }
  if (S.route === 'plugins') renderKeepingFocus();
}
const gpatch = {};
const sendGlobal = debounce((plugin) => {
  const settings = gpatch[plugin]; delete gpatch[plugin];
  if (settings) api.run('setGlobalSettings', { plugin, settings }).then(() => loadGlobalSettings(plugin)).catch(() => {});
}, 500);
function setGlobal(key, value) {
  const plugin = S.gset.plugin;
  S.gset.values[key] = value;
  gpatch[plugin] = { ...(gpatch[plugin] || {}), [key]: value };
  sendGlobal(plugin);
  // Andere Felder hängen davon ab (showIf) → neu zeichnen.
  const p = S.catalog.find((x) => x.uuid === plugin);
  if (p && (p.globalSettingsSchema || []).some((f) => f.showIf && key in f.showIf)) renderKeepingFocus();
}
// Neu zeichnen, ohne dem Benutzer das gerade bearbeitete Feld wegzunehmen.
function renderKeepingFocus() {
  const a = document.activeElement;
  const key = a && a.dataset && a.dataset.in === 'gfield' ? a.dataset.key : null;
  const pos = key && a.selectionStart;
  render();
  if (key) { const el = document.querySelector(`[data-in="gfield"][data-key="${CSS.escape(key)}"]`); if (el) { el.focus(); if (pos != null && el.setSelectionRange) el.setSelectionRange(pos, pos); } }
}

      <h1>Neun Tasten. Drei Regler. Deine Regeln.</h1>

        : `<span class="spin" style="width:18px;height:18px"></span><span style="color:var(--muted)">Warte auf Gerät …</span>`;
    body = `<div class="ob-body rise" style="flex-direction:column;align-items:stretch;max-width:720px">
      <h1>Gerät anschließen</h1>
      <p>Stecke den TreasLin N3 per USB ein. Unter Linux braucht OpenDeckN3 einmalig Zugriff auf das Gerät:</p>
      ${udevBox()}
      <div role="status" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid ${found ? 'color-mix(in srgb,var(--ok) 40%,transparent)' : 'var(--line2)'};background:${found ? 'color-mix(in srgb,var(--ok) 7%,transparent)' : 'var(--panel2)'}">${status}</div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
        <button type="button" class="btn lg" data-act="obBack" style="background:transparent">Zurück</button>
        <button type="button" class="btn primary lg" data-act="obNext" ${found ? '' : 'disabled style="opacity:.55;cursor:default"'}>Weiter ${ic('arrow', 16)}</button>
        ${S.conn === 'online' ? `<button type="button" class="btn ghost" data-act="obVirtual" style="color:var(--accent-text)">Ohne Hardware: virtuelles Gerät verwenden</button>` : ''}
      </div>
    </div>`;
  } else {
    const v = emptySlots();
    if (o.placed) v.encs[1] = { id: 'e1', pos: 1, kind: 'brightness', label: 'Helligkeit', sub: (d ? d.brightness : 50) + ' %', value: d ? d.brightness : 50 };
    body = `<div class="ob-body rise"><div class="txt">
      <h1>Erste Aktion platzieren</h1>
      <p>Ziehe <b style="color:var(--text)">Helligkeit</b> auf den großen Drehregler – oder klicke darauf. Danach regelst du das Display direkt am Gerät.</p>
      <div class="item" data-act="obPlace" draggable="true" data-obdrag="1" role="button" tabindex="0" style="align-self:flex-start;max-width:280px;border:1.5px ${o.placed ? 'solid' : 'dashed'} var(--accent);background:var(--raised);opacity:${o.placed ? .5 : 1};padding:8px 16px 8px 10px">
        <span class="tile" style="background:${KCOL.brightness[0]};color:${KCOL.brightness[1]}">${ic('brightness', 18)}</span>
        <span><span class="nm">Helligkeit</span><span class="meta"><span class="chip">Taste</span><span class="chip">Drehregler</span></span></span>
      </div>
      ${o.placed ? `<div class="rise" style="display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ok)">${ic('check', 18, 2.25)}Platziert auf E1 – dreh mal am Gerät.</div>
          <div><button type="button" class="btn primary lg" data-act="obDone">Zum Editor ${ic('arrow', 16)}</button></div></div>`
        : '<div><button type="button" class="btn" data-act="obBack" style="background:transparent">Zurück</button></div>'}

  }
  return `<main class="ob"><div class="ob-card">
    <ol class="steps" aria-label="Einrichtung">${steps}<li style="margin-left:auto"><button type="button" class="btn ghost" data-act="obDone" style="height:32px">Überspringen</button></li></ol>
    ${body}
  </div></main>`;
}

// The top bar is sticky; sticky content below it needs its real height (it wraps on narrow windows).
function syncBarHeight() {
  const bar = $('.bar');
  document.documentElement.style.setProperty('--bar-h', (bar ? bar.offsetHeight : 0) + 'px');
}
addEventListener('resize', syncBarHeight);

// innerHTML creates every <img> anew, and the browser blanks it until it is decoded: the
// device blinks on each update. Reuse the old element for an unchanged image instead.
function setHTML(el, html) {
  const old = new Map();
  for (const img of el.querySelectorAll('img')) (old.get(img.src) || old.set(img.src, []).get(img.src)).push(img);
  el.innerHTML = html;
  for (const img of el.querySelectorAll('img')) {
    const prev = (old.get(img.src) || []).shift();
    if (!prev) continue;
    for (const a of [...prev.attributes]) prev.removeAttribute(a.name);
    for (const a of img.attributes) prev.setAttribute(a.name, a.value);
    img.replaceWith(prev);
  }
}
// A changed key image only swaps the src: the old picture stays until the new one is ready.
function updateKeyImage(key, image) {
  const img = document.querySelector(`#stage [data-slot="k${key}"] .screen.img img`);
  if (!img || !image) return false;
  img.src = image;
  const tile = S.sel === 'k' + key && document.querySelector('img[alt="Aktuelles Tastenbild"]');
  if (tile) tile.src = image;
  return true;
}
function render() {
  const keepFocus = document.activeElement && document.activeElement.closest && document.activeElement.closest('.device');
  const dev = devState();
  let view;
  if (S.route === 'onboarding') view = onboardingHTML();
  else if ((dev === 'offline' || dev === 'connecting') && S.route !== 'settings') view = offlineHTML();
  else if (S.route === 'plugins') view = pluginsHTML();
  else if (S.route === 'settings') view = settingsHTML();
  else if (dev === 'none') view = noDeviceHTML();
  else view = editorHTML();
  setHTML($('#app'), (S.route === 'onboarding' ? '' : barHTML()) + view);
  renderOverlay();
  syncBarHeight();
  if (keepFocus) { const b = document.querySelector(`[data-slot="${S.sel}"]`); if (b) b.focus(); }
}
function renderStage() {
  const st = $('#stage'); if (!st) return;
  const keepFocus = document.activeElement && document.activeElement.closest && document.activeElement.closest('.device');

function fire(id) {

  const [down, up, field] = knob ? ['encoderDown', 'encoderUp', 'encoder'] : ['keyDown', 'keyUp', 'key'];

  api.run('simulateInput', { device: S.devId, input: { type: down, [field]: n } })

}

const postAppearance = debounce((id, s) => api.run('setActionAppearance', { ...slotParams(id), title: s.title, image: s.image }).catch(() => {}), 350);

// Rückgängig/Wiederholen je Gerät, Profil und Seite. Tippen in einem Feld wird zu einem Schritt zusammengefasst.
const histKey = () => { const d = cur(); return d ? `${S.devId}|${d.activeProfile}|${d.page}` : ''; };
const hist = () => (S.hist[histKey()] ||= { undo: [], redo: [] });
const savedSlot = (id) => { const d = S.saved[S.devId]; const { c, p } = parseId(id); return d ? clone(d[c][p]) : null; };
function syncHistButtons() {
  const h = hist();
  document.querySelectorAll('[data-act="undo"]').forEach((b) => { b.disabled = !h.undo.length; });
  document.querySelectorAll('[data-act="redo"]').forEach((b) => { b.disabled = !h.redo.length; });
}
function remember(ids, merge) {
  const h = hist(), last = h.undo[h.undo.length - 1], now = Date.now();
  if (merge && last && last.merge === ids[0] && now - last.at < 2000) { last.at = now; return; }
  h.undo.push({ ids, before: ids.map(savedSlot), at: now, merge: merge ? ids[0] : null });
  if (h.undo.length > 100) h.undo.shift();
  h.redo = [];
  syncHistButtons();
}
async function putSlots(ids, instances) {
  for (const [i, id] of ids.entries()) await api.call('setSlot', { ...slotParams(id), instance: instances[i] });
}
async function stepHistory(redo) {
  const h = hist(), from = redo ? h.redo : h.undo;
  if (!from.length) { toast('warn', redo ? 'Nichts zum Wiederholen' : 'Nichts zum Rückgängigmachen'); return; }
  // Noch gebündelte Eingaben erst senden lassen und den Stand des Dienstes holen.
  const last = h.undo[h.undo.length - 1];
  if (last) await new Promise((r) => setTimeout(r, Math.max(0, 400 - (Date.now() - last.at))));
  await refresh();
  const e = from.pop();
  (redo ? h.undo : h.redo).push({ ids: e.ids, before: e.ids.map(savedSlot), at: 0, merge: null });
  syncHistButtons();
  try { await putSlots(e.ids, e.before); toast('ok', redo ? 'Wiederholt' : 'Rückgängig gemacht'); } catch (err) { toast('err', err.message); }
}

function moveSlot(from, to) {
  if (from === to || parseId(from).ctl !== parseId(to).ctl) { render(); return; }
  const a = savedSlot(from), b = savedSlot(to);
  remember([from, to]);

    .then(() => toast('ok', b ? `${slotShort(from)} und ${slotShort(to)} getauscht` : `${slotShort(from)} → ${slotShort(to)} verschoben`))
    .catch((e) => toast('err', e.message));

function syncBrightness(except) {

function moveSel(key) {
  const grid = libMode() === 'Encoder'
    ? [['e1', 'e1'], ['e0', 'e2']]
    : [['k0', 'k1', 'k2', 'k10'], ['k3', 'k4', 'k5', 'k10'], ['k6', 'k7', 'k8', 'k9', 'k11']];
  let r = grid.findIndex((row) => row.includes(S.sel)); if (r < 0) r = 0;
  let c = Math.max(0, grid[r].indexOf(S.sel));
  if (key === 'ArrowRight') c = Math.min(grid[r].length - 1, c + 1);
  if (key === 'ArrowLeft') c = Math.max(0, c - 1);
  if (key === 'ArrowDown') { r = Math.min(grid.length - 1, r + 1); c = Math.min(c, grid[r].length - 1); }
  if (key === 'ArrowUp') { r = Math.max(0, r - 1); c = Math.min(c, grid[r].length - 1); }
  S.sel = grid[r][c];
}
// Bilddatei → quadratisches 144-px-PNG als Data-URL (Gerät skaliert auf 64 px).
function imageToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const n = 144, c = document.createElement('canvas'); c.width = c.height = n;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, n, n);
      URL.revokeObjectURL(img.src); resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error('Bild konnte nicht gelesen werden'));
    img.src = URL.createObjectURL(file);
  });
}

function installPluginFile(file) {
  if (!/\.(streamdeckplugin|zip)$/i.test(file.name)) { toast('err', 'Bitte eine .streamDeckPlugin- oder .zip-Datei wählen'); return; }
  const reader = new FileReader();
  reader.onload = () => installPlugin({ data: reader.result }, 'file');
  reader.onerror = () => toast('err', 'Datei nicht lesbar');
  reader.readAsDataURL(file);
}

const ACTS = {

  popover(arg) { S.popover = S.popover === arg ? null : arg; render(); },
  device(arg) { S.devId = arg; local.set('device', arg); S.popover = null; S.sel = 'k0'; render(); },
  startVirtual() { S.popover = null; startVirtual(); },
  test() { S.test = !S.test; render(); },
  switchPage(i) { const d = cur(); if (!d || +i === d.page) return; api.run('switchPage', { device: S.devId, page: +i }).catch(() => {}); },

    const i = S.pmenu.page; S.pmenu = null; renderOverlay();
    api.run('copyPage', { device: S.devId, page: i }).then((r) => toast('ok', `Kopie als Seite ${r.page + 1} angelegt`)).catch(() => {});
  },

  pageDelete() {
    const d = cur(), i = S.pmenu.page, p = d.pages[i]; S.pmenu = null;

    if (!count) { renderOverlay(); api.run('deletePage', { device: S.devId, page: i }).then(() => toast('ok', `${pageName(d, i)} gelöscht`)).catch(() => {}); return; }

  group(arg) { S.closed[arg] = !S.closed[arg]; $('#liblist').innerHTML = libListHTML(); },
  clear() { clearSlot(S.sel); },
  jsonMode() { S.json = !S.json; S.rec = null; render(); },
  startRec(key) { startRec(key); },
  libMode(mode) {
    if (libMode() === mode) return;
    S.sel = lastSel[mode] || (mode === 'Encoder' ? 'e1' : 'k0');

  },
  cancelRec() { stopRec(); },
  clearField(key) {
    const s = slot(S.sel); if (!s) return;
    s.settings = { ...s.settings, [key]: '' }; render(); sendSettings(S.sel, s.settings);

  async exportProfiles() {
    const name = `opendeckn3-profile-${new Date().toISOString().slice(0, 10)}.json`;
    try {
      const data = await api.call('exportProfiles', { device: S.devId });
      const text = JSON.stringify(data, null, 2);
      if (desktop) {
        // Die Desktop-App öffnet den Speichern-Dialog selbst und schreibt nur an die gewählte Stelle.
        if (!await desktop('save_file_as', { title: 'Profile exportieren', fileName: name, contents: text })) return;
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }
      toast('ok', `${data.profiles.length} ${data.profiles.length === 1 ? 'Profil' : 'Profile'} exportiert`);
    } catch (e) { toast('err', e.message || String(e)); }

    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = async () => {
      const file = i.files[0]; if (!file) return;
      try {
        let data;
        try { data = JSON.parse(await file.text()); } catch { throw new Error('Die Datei ist keine Exportdatei von OpenDeckN3'); }
        const r = await api.call('importProfiles', { device: S.devId, data });
        toast('ok', r.imported.length ? `Importiert: ${r.imported.join(', ')}` : 'Die Datei enthält keine Profile');
      } catch (e) { toast('err', e.message); }
    };
    i.click();
  },

  pluginTab(arg) { S.pluginTab = arg; if (arg === 'store' && !S.store) loadStore(false); render(); },

  reloadOptions(k) { delete S.popts[k]; render(); },
  openPluginSettings(uuid) { S.pluginSel = uuid; S.pluginTab = 'installed'; ACTS.nav('plugins'); },
  gbutton(key) {
    if (!S.gset) return;
    S.gset.values[key] = Date.now();
    // Sofort sichtbar machen, dass etwas passiert; das Plugin meldet gleich das Ergebnis.
    const p = S.catalog.find((x) => x.uuid === S.gset.plugin);
    const f = p && (p.globalSettingsSchema || []).find((x) => x.key === key);

  async installFile() {
    if (S.pbusy) return;
    if (desktop) {
      let path;
      try {
        path = await desktop('plugin:dialog|open', { options: { title: 'Plugin-Datei wählen', multiple: false, directory: false,
          filters: [{ name: 'Plugin (.streamDeckPlugin, .zip)', extensions: ['streamDeckPlugin', 'zip'] }] } });
      } catch (e) { toast('err', String(e)); return; }
      if (path) installPlugin({ path }, 'file');
      return;
    }
    const input = document.createElement('input');

    input.onchange = () => { if (input.files[0]) installPluginFile(input.files[0]); };

      await desktop(want ? 'plugin:autostart|enable' : 'plugin:autostart|disable');

      toast('ok', S.autostart ? 'Startet ab jetzt beim Anmelden' : 'Autostart ausgeschaltet');
