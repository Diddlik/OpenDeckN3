  },
  storeInstall(uuid) { const e = storeEntry(uuid); if (e) installPlugin({ repo: e.repo, asset: e.asset }, uuid); },
  confirmGithub() { const repo = S.modal.repo; S.modal = null; renderOverlay(); installPlugin({ repo }, 'gh'); },
  uninstallPlugin(uuid) { const p = S.catalog.find((x) => x.uuid === uuid); if (p) { S.modal = { kind: 'uninstall', uuid, name: p.name }; renderOverlay(); } },
  async confirmUninstall() {
    const { uuid, name } = S.modal; S.modal = null; renderOverlay();
    try { await api.run('uninstallPlugin', { plugin: uuid }); toast('ok', `${name} entfernt`); await refresh(); } catch { /* Toast */ }
  },
  openConfigDir() { desktop('open_config_dir').catch((e) => toast('err', String(e))); },
  openPluginsDir() { desktop('open_plugins_dir').catch((e) => toast('err', String(e))); },
  openLog() { desktop('open_log').catch((e) => toast('err', String(e))); },
  async autostart() {
    const want = !S.autostart;
    try {
      await desktop(want ? 'plugin:autostart|enable' : 'plugin:autostart|disable');
      S.autostart = await desktop('plugin:autostart|is_enabled');
      toast('ok', S.autostart ? 'Startet ab jetzt beim Anmelden' : 'Autostart ausgeschaltet');
    } catch (e) { toast('err', 'Autostart: ' + e); }
    render();
  },
  copyPath(arg) { copy(arg, 'Pfad'); },
  copyStart(arg) { copy(arg === 'debug' ? 'RUST_LOG=debug opendeckn3d' : 'opendeckn3d', 'Befehl'); },
  retry() { S.conn = 'connecting'; render(); api.connect(); },
  theme(arg) { S.theme = arg; local.set('theme', arg); applyTheme(); render(); },
  finish(arg) { S.finish = arg; local.set('finish', arg); render(); },
  restartOnboarding() { S.ob = { step: 0, copied: false, placed: false }; S.route = 'onboarding'; render(); },
  copyUdev() {
    const done = () => { S.ob.copied = true; render(); clearTimeout(copyTimer); copyTimer = setTimeout(() => { S.ob.copied = false; render(); }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(UDEV).then(done, done); else done();
  },
  obNext() { S.ob.step = Math.min(2, S.ob.step + 1); render(); },
  obBack() { S.ob.step = Math.max(0, S.ob.step - 1); render(); },
  async obVirtual() { await startVirtual(); if (cur()) { S.ob.step = 2; render(); } },
  obPlace() {
    if (S.ob.placed) return;
    if (!isLive()) { toast('warn', 'Erst ein Gerät verbinden'); return; }
    S.ob.placed = true; render();
    api.run('setAction', { device: S.devId, controller: 'Encoder', position: 1, plugin: BUILTIN, action: BUILTIN + '.brightness' }).catch(() => {});
  },
  obDone() { if (S.ob.placed) S.sel = 'e1'; finishOnboarding(); }
};

/* ---------- Ereignisse ---------- */
document.addEventListener('focusin', (e) => {
  const box = e.target.closest && e.target.closest('.hotkey[data-act="startRec"]');
  if (box && !S.rec && e.target === box) startRec(box.dataset.arg);
});
document.addEventListener('keyup', (e) => {
  // Die Windows-Taste allein (Startmenü) ist auch ein gültiges Kürzel.
  if (S.rec && (e.key === 'Meta' || e.key === 'OS') && S.recPreview === 'Win') { e.preventDefault(); commitRec('Win'); }
}, true);
document.addEventListener('click', (e) => {
  if (S.rec && !e.target.closest('.hotkey')) { stopRec(); }
  if (S.menu && !e.target.closest('.ctx')) { S.menu = null; renderOverlay(); }
  if (S.popover && !e.target.closest('.popover') && !e.target.closest('[data-act="popover"]')) { S.popover = null; render(); }
  const slotEl = e.target.closest('[data-slot]');
  if (slotEl && slotEl.classList.contains('locked')) {
    toast('warn', 'Im Modus „Drehregler“ sind nur die Regler belegbar – oben auf „Tasten“ umschalten.');
    return;
  }
  if (slotEl) {
    const id = slotEl.dataset.slot;
    if (id !== S.sel) S.json = false;
    S.sel = id; render();
    if (devState() === 'virtual' && S.test) fire(id);
    return;
  }
  const pick = e.target.closest('[data-pick]');
  if (pick) { assign(pick.dataset.pick, S.sel); return; }
  const act = e.target.closest('[data-act]');
  if (act && !act.disabled && ACTS[act.dataset.act]) ACTS[act.dataset.act](act.dataset.arg, e);
});

document.addEventListener('contextmenu', (e) => {
  const slotEl = e.target.closest('[data-slot]');
  if (!slotEl || slotEl.classList.contains('locked')) return;
  e.preventDefault();
  S.sel = slotEl.dataset.slot; S.menu = { id: S.sel, x: e.clientX, y: e.clientY };
  render();
});

document.addEventListener('input', (e) => {
  const t = e.target; const k = t.dataset.in; if (!k) return;
  const d = cur();
  if (k === 'q') { S.q = t.value; $('#liblist').innerHTML = libListHTML(); }
  else if (k === 'gh') S.gh = t.value;
  else if (k === 'gfield' && S.gset) setGlobal(t.dataset.key, t.value);
  else if (k === 'brightness' && d) { d.brightness = clamp(+t.value, 0, 100); syncBrightness(t); sendBrightness(d.brightness); }
  else if (k === 'title') { const s = slot(S.sel); if (!s) return; s.title = t.value || null; renderStage(); sendAppearance(S.sel, s); }
  else if (k === 'sfield' && t.dataset.type !== 'shortcut') {
    const s = slot(S.sel); if (!s) return;
    let v = t.value;
    if (t.dataset.type === 'number') { if (v.trim() === '' || isNaN(+v)) return; v = +v; }
    s.settings = { ...s.settings, [t.dataset.key]: v }; renderStage(); sendSettings(S.sel, s.settings);
    const f = findAction(s.plugin, s.action);
    const schema = (f && f.a.settingsSchema) || [];
    if (schema.some((x) => (x.dependsOn || []).includes(t.dataset.key) || (x.showIf && t.dataset.key in x.showIf))) render();
  }
  else if (k === 'setting') {
    const s = slot(S.sel); if (!s) return;
    const old = s.settings[t.dataset.key];
    let v = t.value;
    if (typeof old === 'number' && v.trim() !== '' && !isNaN(+v)) v = +v;
    if (typeof old === 'boolean' && (v === 'true' || v === 'false')) v = v === 'true';
    s.settings[t.dataset.key] = v; renderStage(); sendSettings(S.sel, { ...s.settings });
  }
});
document.addEventListener('change', (e) => {
  const t = e.target; const k = t.dataset.in;
  if (k === 'profile') switchProfile(t.value).catch(() => render());
  if (k === 'profileTarget') { const s = slot(S.sel); if (!s) return; s.settings = { ...s.settings, profile: t.value }; renderStage(); sendSettings(S.sel, s.settings); }
  if (k === 'json') {
    const s = slot(S.sel); if (!s) return;
    let v; try { v = JSON.parse(t.value); } catch (err) { $('#jsonErr').textContent = 'Ungültiges JSON: ' + err.message; return; }
    if (!v || typeof v !== 'object' || Array.isArray(v)) { $('#jsonErr').textContent = 'Einstellungen müssen ein JSON-Objekt sein.'; return; }
    $('#jsonErr').textContent = ''; s.settings = v; renderStage(); sendSettings(S.sel, v);
  }
  if (k === 'port') {
    const p = Number(t.value);
    if (!Number.isInteger(p) || p < 1 || p > 65535) { toast('err', 'Ungültiger Port'); t.value = S.port; return; }
    S.port = p; local.set('apiPort', p); S.conn = 'connecting'; api.connect(); toast('ok', `Verbinde mit Port ${p}`);
  }
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'ghForm') {
    e.preventDefault();
    const repo = $('#ghRepo').value.trim(); S.gh = repo;
    if (!repo) { toast('warn', 'GitHub-Repository angeben, z. B. besitzer/mein-plugin'); return; }
    S.modal = { kind: 'github', repo }; renderOverlay();
    return;
  }
  if (e.target.id !== 'newProfileForm') return;
  e.preventDefault();
  const v = $('#newProfileName').value.trim();
  const d = cur();
  let err = '';
  if (!v) err = 'Bitte einen Namen eingeben.';
  else if (!PROFILE_ID.test(v)) err = 'Nur A–Z a–z 0–9 - _ . erlaubt, nicht mit „.“ am Anfang.';
  else if (d && d.profiles.includes(v)) err = 'Ein Profil mit diesem Namen gibt es schon.';
  if (err) { S.modal = { kind: 'new', value: v, error: err }; renderOverlay(); return; }
  S.modal = null; renderOverlay();
  switchProfile(v).then(() => toast('ok', `Profil „${v}“ angelegt`)).catch(() => {});
});

// Anzeige mit deutschen Tastennamen; gespeichert wird „Ctrl+Shift+M“ (der Dienst versteht beides).
const KEY_DE = { Ctrl: 'Strg', Shift: 'Umschalt', Delete: 'Entf', Space: 'Leertaste', Insert: 'Einfg', Home: 'Pos1', End: 'Ende',
  PageUp: 'Bild ↑', PageDown: 'Bild ↓', Up: '↑', Down: '↓', Left: '←', Right: '→', Backspace: '⌫', Enter: 'Enter ↵' };
const capsHTML = (combo) => combo.split(' ').map((chord) => chord.split('+').map((k) => `<kbd>${esc(KEY_DE[k] || k)}</kbd>`).join('<span class="plus">+</span>')).join('<span class="plus">&nbsp;dann&nbsp;</span>');
const modsOf = (e) => [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Win'].filter(Boolean);
function startRec(key) { S.rec = key; S.recPreview = ''; S.recOther = false; render(); }
function stopRec() { S.rec = null; S.recPreview = ''; render(); }
function commitRec(combo) {
  const key = S.rec; const s = slot(S.sel);
  S.rec = null; S.recPreview = '';
  if (!s || !key) { render(); return; }
  s.settings = { ...s.settings, [key]: combo };
  render(); renderStage();
  api.run('setActionSettings', { ...slotParams(S.sel), settings: s.settings }).catch(() => {});
}
// Tastenkürzel-Recorder: gedrückte Kombination in Text wie „Ctrl+Shift+M“ übersetzen.
function comboFromEvent(e) {
  if (['Control', 'Shift', 'Alt', 'Meta', 'AltGraph', 'OS'].includes(e.key)) return null;
  const mods = [];
  if (e.ctrlKey) mods.push('Ctrl');
  if (e.altKey) mods.push('Alt');
  if (e.shiftKey) mods.push('Shift');
  if (e.metaKey) mods.push('Win');
  const named = { ' ': 'Space', Enter: 'Enter', Escape: 'Esc', Tab: 'Tab', Backspace: 'Backspace', Delete: 'Delete', Insert: 'Insert',
    Home: 'Home', End: 'End', PageUp: 'PageUp', PageDown: 'PageDown', ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left',
    ArrowRight: 'Right', CapsLock: 'CapsLock', PrintScreen: 'PrintScreen', Pause: 'Pause', AudioVolumeUp: 'VolumeUp',
    AudioVolumeDown: 'VolumeDown', AudioVolumeMute: 'VolumeMute', MediaPlayPause: 'PlayPause', MediaTrackNext: 'Next', MediaTrackPrevious: 'Prev' };
  let name = named[e.key] || (/^F\d{1,2}$/.test(e.key) ? e.key : null);
  if (!name) {
    if (/^Key[A-Z]$/.test(e.code)) name = e.code.slice(3);
    else if (/^Digit\d$/.test(e.code)) name = e.code.slice(5);
    else if (e.code === 'NumpadAdd' || e.key === '+') name = 'Plus';
    else if (e.code === 'NumpadSubtract' || e.key === '-') name = 'Minus';
    else if (e.key.length === 1) name = e.key.toUpperCase();
    else return null;
  }
  return [...mods, name].join('+');
}
document.addEventListener('keydown', (e) => {
  if (S.rec) {
    // Aufnahme läuft: jede Taste gehört dem Recorder, nichts wird getippt.
    e.preventDefault(); e.stopPropagation();
    if (e.repeat) return;
    if (e.key === 'Escape' && !modsOf(e).length) { stopRec(); return; }
    const combo = comboFromEvent(e);
    if (!combo) { // nur Zusatztaste gedrückt – live anzeigen und auf die eigentliche Taste warten
      const preview = modsOf(e).join('+');
      if (preview !== S.recPreview) { S.recPreview = preview; render(); }
      return;
    }
    commitRec(combo);
    return;
  }
  if (e.key === 'Escape') {
    if (S.modal) { if (!S.upd.busy && !S.upd.done) { S.modal = null; renderOverlay(); } return; }
    if (S.menu) { S.menu = null; renderOverlay(); return; }
    if (S.popover) { S.popover = null; render(); return; }
  }
  const pick = e.target.closest && e.target.closest('[data-pick],[data-obdrag]');
  if (pick && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick.click(); return; }
  if (!(e.target.closest && e.target.closest('.device [data-slot]'))) return;
  if (e.key.startsWith('Arrow')) { e.preventDefault(); moveSel(e.key); S.json = false; render(); }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); clearSlot(S.sel); }
}, true); // Capture-Phase: der Recorder bekommt Tasten vor allen anderen Handlern

document.addEventListener('wheel', (e) => {
  const b = e.target.closest && e.target.closest('[data-enc]');
  if (!b || devState() !== 'virtual' || !S.test) return;
  e.preventDefault();
  const now = Date.now(); if (now - twistAt < 60) return; twistAt = now;
  S.sel = 'e' + b.dataset.enc;
  twist(+b.dataset.enc, e.deltaY < 0 ? 1 : -1);
}, { passive: false });

/* Drag & Drop: Bibliothek → Slot */
document.addEventListener('dragstart', (e) => {
  const ob = e.target.closest && e.target.closest('[data-obdrag]');
  if (ob) { e.dataTransfer.setData('text/plain', 'ob'); return; }
  const it = e.target.closest && e.target.closest('[data-pick]'); if (!it) return;
  S.drag = it.dataset.pick;
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', S.drag);
  it.classList.add('dragging');
  requestAnimationFrame(renderStage);
});
const isFileDrag = (e) => S.route === 'plugins' && !S.drag && e.dataTransfer && [...e.dataTransfer.types].includes('Files');
document.addEventListener('dragover', (e) => {
  if (isFileDrag(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; const m = $('#pluginsMain'); if (m) m.classList.add('dropzone'); return; }
  if (S.route === 'onboarding') { if (e.target.closest('#obdev')) e.preventDefault(); return; }
  if (!S.drag) return;
  const f = actionByKey(S.drag);
  const el = e.target.closest('[data-slot]');
  let over = null;
  if (el && f && !el.classList.contains('locked') && ctlOf(f.a).includes(parseId(el.dataset.slot).ctl)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; over = el.dataset.slot; }
  if (over !== S.over) { setOver(over); }
});
// Hover-Ziel nur per Klasse markieren – den DOM unter dem Zeiger nicht ersetzen.
function setOver(id) {
  const mark = (slotId, on) => {
    const el = slotId && document.querySelector(`#stage [data-slot="${slotId}"]`); if (!el) return;
    el.classList.remove('over', 'target', 'replace');
    el.classList.add(on ? 'over' : slot(slotId) ? 'replace' : 'target');
  };
  mark(S.over, false); S.over = id; mark(id, true);
}
document.addEventListener('dragleave', (e) => {
  if (!e.relatedTarget) { const m = $('#pluginsMain'); if (m) m.classList.remove('dropzone'); }
});
document.addEventListener('drop', (e) => {
  if (isFileDrag(e)) {
    e.preventDefault();
    const m = $('#pluginsMain'); if (m) m.classList.remove('dropzone');
    const file = e.dataTransfer.files[0]; if (file && !S.pbusy) installPluginFile(file);
    return;
  }
  if (S.route === 'onboarding') { if (e.target.closest('#obdev')) { e.preventDefault(); ACTS.obPlace(); } return; }
  if (!S.drag) return;
  e.preventDefault();
  const el = e.target.closest('[data-slot]');
  const key = S.drag; S.drag = null; S.over = null;
  if (el) assign(key, el.dataset.slot); else render();
});
document.addEventListener('dragend', () => { if (S.drag) { S.drag = null; S.over = null; render(); } });

matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S.theme === 'system') applyTheme(); });

// Desktop-App: echte Pfade/Autostart laden, externe Links im Standardbrowser öffnen.
async function initDesktop() {
  if (!desktop) return;
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[target="_blank"]');
    if (!a) return;
    e.preventDefault();
    desktop('plugin:opener|open_url', { url: a.href }).catch((err) => toast('err', String(err)));
  }, true);
  try { const p = await desktop('desktop_paths'); CONFIG_DIR = p.config; S.appVersion = p.version; } catch { /* Standardpfad bleibt */ }
  try { S.autostart = await desktop('plugin:autostart|is_enabled'); } catch { /* bleibt aus */ }
  window.__TAURI__.event.listen('update-progress', ({ payload }) => {
    const bar = $('#updBar'), text = $('#updText'); if (!bar) return;
    const mb = (n) => (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
    const pct = payload.total ? Math.floor(payload.downloaded * 100 / payload.total) : null;
    bar.style.width = (pct ?? 50) + '%';
    text.textContent = pct === null ? `Lade herunter … ${mb(payload.downloaded)}` : `Lade herunter … ${pct} % (${mb(payload.downloaded)} von ${mb(payload.total)})`;
  });
  render();
  // Beim Start (kurz verzögert) und alle 6 Stunden – gefragt wird immer.
  setTimeout(() => { if (S.updAuto) checkUpdates(false); }, 8000);
  setInterval(() => { if (S.updAuto) checkUpdates(false); }, 6 * 3600 * 1000);
}

// Fragt GitHub nach neuen Releases (über die Desktop-App, die den Download auch prüft).
async function checkUpdates(manual) {
  if (!desktop) return;
  try {
    const r = await desktop('update_check', { includePrerelease: S.updPre });
    S.updLast = new Date().toISOString(); local.set('updLast', S.updLast);
    S.updCanInstall = r.canInstall;
    const u = r.update;
    if (u && (manual || u.version !== local.get('updSkip', null))) {
      const isNew = !S.update || S.update.version !== u.version;
      S.update = u;
      // Nicht mitten ins Onboarding oder einen anderen Dialog platzen.
      if ((manual || isNew) && !S.modal && S.route !== 'onboarding') ACTS.showUpdate();
    } else if (manual) {
      toast('ok', `Du hast die neueste Version (${r.current})`);
    }
    render();
  } catch (e) {
    if (manual) toast('err', 'Update-Prüfung fehlgeschlagen: ' + e);
  }
}

applyTheme();
render();
api.connect();
initDesktop();
</script>
