<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDeckN3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ Design-Tokens ============ */
:root,[data-theme="dark"]{
  --bg:#0B0D10;--stage:#0E1014;--panel:#121519;--panel2:#171A1F;--raised:#1E2228;--hover:#22262D;
  --line:#2A2F37;--line2:#1F242B;--text:#ECEEF1;--muted:#A0A7B2;--faint:#8A929E;
  --accent:#35E0D0;--accent-ink:#062320;--accent-text:#35E0D0;--accent-soft:rgba(53,224,208,.14);
  --ok:#4ADE80;--warn:#F5B841;--err:#F26D6D;--err-text:#F7A0A0;
  --dot:rgba(255,255,255,.05);--shadow:0 16px 40px rgba(0,0,0,.45);--input:#0E1014;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F4F5F7;--stage:#ECEEF1;--panel:#FFFFFF;--panel2:#FAFAFB;--raised:#EEF0F3;--hover:#E8EBEF;
  --line:#DDE1E6;--line2:#E4E7EB;--text:#14171C;--muted:#545C69;--faint:#69717E;
  --accent:#0B8A80;--accent-ink:#FFFFFF;--accent-text:#0B7F76;--accent-soft:rgba(11,138,128,.12);
  --ok:#15803D;--warn:#A16207;--err:#C42B2B;--err-text:#B42323;
  --dot:rgba(0,0,0,.06);--shadow:0 16px 40px rgba(20,23,28,.12);--input:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ============ Grundbausteine ============ */
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--raised);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{border-color:color-mix(in srgb,var(--err) 45%,transparent);background:color-mix(in srgb,var(--err) 8%,transparent);color:var(--err-text)}
.btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:12px}
.btn.icon{width:40px;padding:0}
.field{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--input);padding:0 12px;font-size:14px;min-width:0}
select.field{padding:0 10px}
.chip{font-size:10px;font-weight:600;letter-spacing:.02em;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.switch{width:46px;height:28px;flex:none;border-radius:999px;border:0;background:var(--line);padding:3px;display:flex}
.switch span{width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .18s ease}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{transform:translateX(18px);background:var(--accent-ink)}
.seg{display:flex;padding:4px;gap:4px;border-radius:12px;background:var(--input);border:1px solid var(--line)}
.seg button{height:32px;padding:0 14px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.seg button[aria-checked="true"]{background:var(--raised);color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.rise{animation:rise .25s ease}
pre.code{margin:0;padding:14px;font-family:'Geist Mono',monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;overflow-x:auto}
.codebox{border-radius:14px;border:1px solid var(--line2);background:var(--panel);overflow:hidden}
.codebox-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line2);font-size:13px;color:var(--muted)}

/* ============ Titelleiste ============ */
.bar{min-height:64px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand b{color:var(--accent-text);font-weight:600}
.nav{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2)}
.nav button{height:32px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.nav button[aria-current="page"]{background:var(--raised);color:var(--text)}
.bar .grow{flex:1}
.devsel{height:40px;padding:0 10px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:10px;position:relative}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.badge.virt{background:rgba(160,132,255,.16);color:#B9A4FF}
[data-theme="light"] .badge.virt{color:#6D4BD8}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.bright{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:10px;color:#E3B341}
.bright input{width:120px;accent-color:var(--accent)}
.bright output{font-family:'Geist Mono',monospace;font-size:12px;color:var(--text);width:40px;text-align:right}
.popover{position:absolute;top:calc(100% + 6px);right:0;min-width:280px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);box-shadow:var(--shadow);z-index:50}
.popover button{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:8px;background:transparent;text-align:left}
.popover button:hover{background:var(--hover)}
.popover small{display:block;font-family:'Geist Mono',monospace;font-size:11px;color:var(--faint)}

/* ============ Editor-Layout ============ */
.editor{flex:1;display:grid;grid-template-columns:280px minmax(0,1fr) 340px;min-height:0}
@media (max-width:1180px){.editor{grid-template-columns:260px minmax(0,1fr)}.insp{grid-column:1 / -1;border-left:0!important;border-top:1px solid var(--line2)}}
@media (max-width:760px){.editor{grid-template-columns:minmax(0,1fr)}.lib{border-right:0!important;border-bottom:1px solid var(--line2)}}

/* Bibliothek */
.lib{background:var(--panel);border-right:1px solid var(--line2);padding:20px 14px 16px;display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--faint)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:14px;color:var(--text)}
.grp{display:flex;align-items:center;gap:6px;height:32px;width:100%;padding:0 6px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;text-align:left}
.grp svg{transition:transform .15s ease}
.grp[aria-expanded="true"] svg{transform:rotate(90deg)}
.grp .n{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;font-weight:400;color:var(--faint)}
.item{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 8px 6px 4px;border-radius:10px;border:1.5px solid transparent;background:transparent;text-align:left;cursor:grab;user-select:none}
.item:hover{background:var(--hover)}
.item.dragging{border-style:dashed;border-color:var(--accent);opacity:.5}
.item .grip{color:var(--line);display:flex}
.tile{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center}
.item .nm{font-size:14px;font-weight:500}
.item .meta{display:flex;gap:4px;margin-top:4px}

/* Bühne */
.center{padding:24px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.head h1{margin:2px 0 0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.toggle{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:500}
.toggle .switch{width:34px;height:20px;padding:2px}
.toggle .switch span{width:16px;height:16px}
.toggle[aria-pressed="true"] .switch{background:var(--accent)}
.toggle[aria-pressed="true"] .switch span{transform:translateX(14px);background:var(--accent-ink)}
.stage{flex:1;min-height:540px;position:relative;border-radius:20px;border:1px solid var(--line2);background-color:var(--stage);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 16px;overflow:hidden;transition:border-color .2s}
.stage.dragmode{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.hint{display:flex;align-items:center;gap:14px;max-width:460px;padding:14px 18px 14px 14px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow)}
.hint .tile{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text)}
.pill{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:13px;color:var(--muted)}
.status .mono{font-size:12px}

/* Inspektor */
.insp{background:var(--panel);border-left:1px solid var(--line2);padding:24px;display:flex;flex-direction:column;gap:22px}
.insp h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.insp section{display:flex;flex-direction:column;gap:12px}
.insp label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.insp .row{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px}
.empty-card{border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.danger{margin-top:auto;padding-top:16px;border-top:1px solid var(--line2)}
.danger h3{color:var(--err)!important}

/* ============ Gerät (Layout nach Produktfoto) ============ */
.device{--dim:1;width:700px;padding:30px 32px 18px 36px;border-radius:30px;border:1px solid #2E333B;background:linear-gradient(180deg,#23272E 0%,#17191E 100%);box-shadow:0 40px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px;color:#ECEEF1;flex:none;transition:filter .3s,opacity .3s;--well:#191C21;--wellline:#2C3139;--trk:#2A2F37;--lbl:#D7DBE1;--lblEmpty:#8A929E;--sub:#8A929E;--eng:#6B7280}
.device.white{background:linear-gradient(180deg,#F7F8FA 0%,#E3E6EA 100%);border-color:#D3D7DD;box-shadow:0 40px 80px rgba(0,0,0,.35),inset 0 1px 0 #fff;--well:#E9ECEF;--wellline:#D0D4DA;--trk:#C9CED5;--lbl:#2B3038;--lblEmpty:#6B7280;--sub:#5B6370;--eng:#8A929E}
.device.offline{filter:grayscale(1);opacity:.45;pointer-events:none}
.dev-row{display:flex;gap:40px;align-items:stretch}
.dev-left{display:flex;flex-direction:column;gap:22px}
.keys{display:grid;grid-template-columns:repeat(3,96px);gap:14px}
.device.flip .keys .key,.device.flip .rkey,.device.flip .knob{animation:flip .38s ease}
@keyframes flip{0%{transform:perspective(500px) rotateY(0)}50%{transform:perspective(500px) rotateY(90deg);opacity:.2}100%{transform:perspective(500px) rotateY(0)}}
.key{position:relative;width:96px;height:96px;padding:7px;border-radius:16px;border:1px solid #0A0B0D;background:#0F1114;box-shadow:inset 0 -3px 0 rgba(0,0,0,.6),0 3px 6px rgba(0,0,0,.35);transition:transform .12s ease,box-shadow .2s ease,opacity .2s}
.key:hover,.rkey:hover{transform:translateY(1px)}
.key:active,.rkey:active{transform:translateY(2px) scale(.97)}
.screen{width:100%;height:100%;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;filter:brightness(var(--dim));border:1px solid rgba(255,255,255,.05);font-size:11px;font-weight:600;letter-spacing:.02em}
.screen .t{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen .big{font-family:'Geist Mono',monospace;font-size:28px;font-weight:500;line-height:1}
.screen .small{font-size:10px;font-weight:500;opacity:.8}
.screen.empty{background:#0E1014;color:#5B6370;border:1.5px dashed #2F353E}
.rkeys{display:grid;grid-template-columns:repeat(3,96px);gap:14px;justify-items:center}
.rkey-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.rkey{position:relative;width:62px;height:62px;border-radius:50%;border:1px solid #0A0B0D;background:radial-gradient(circle at 50% 32%,#3E434C 0%,#1C1F24 62%,#121418 100%);box-shadow:0 0 0 7px var(--well),0 0 0 8px var(--wellline),0 6px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#ECEEF1;transition:transform .12s ease,box-shadow .2s}
.rkey.isempty{color:#6B7280}
.rlabel{font-size:11px;font-weight:500;color:var(--lbl);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlabel.e{color:var(--lblEmpty)}
.dev-right{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px}
.knob-row{display:flex;gap:40px}
.knob-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.knob-btn{position:relative;padding:0;border:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s}
.knob-btn svg{position:absolute;inset:0;width:100%;height:100%}
.knob-btn .trk,.knob-btn .val{fill:none;stroke-linecap:round}
.knob-btn .trk{stroke:var(--trk)}
.knob-btn .val{stroke:#35E0D0;transition:stroke-dasharray .15s ease}
.knob{position:relative;border-radius:50%;background-color:#16181C;background-image:repeating-conic-gradient(rgba(255,255,255,.05) 0deg 3deg,transparent 3deg 6deg),conic-gradient(from 210deg,#101215,#3A3F47,#15171B,#2E333A,#101215);display:flex;justify-content:center;transition:transform .15s ease}
.knob i{display:block;width:3px;border-radius:2px;background:#ECEEF1}
.big .knob-btn{width:176px;height:176px}
.big .knob{width:140px;height:140px;box-shadow:0 14px 28px rgba(0,0,0,.6),inset 0 0 0 6px #0C0D10,inset 0 1px 0 rgba(255,255,255,.15)}
.big .knob i{margin-top:12px;height:20px}
.big svg circle{stroke-width:3}
.small .knob-btn{width:92px;height:92px}
.small .knob{width:66px;height:66px;box-shadow:0 8px 14px rgba(0,0,0,.6),inset 0 0 0 4px #0C0D10,inset 0 1px 0 rgba(255,255,255,.15)}
.small .knob i{margin-top:7px;height:12px}
.small svg circle{stroke-width:5}
.knob-wrap.isempty .knob i{background:#4B5260}
.klabel{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--lbl);white-space:nowrap}
.klabel.e{color:var(--lblEmpty)}
.ksub{font-family:'Geist Mono',monospace;font-size:11px;color:var(--sub);height:14px;white-space:nowrap}
.engrave{display:flex;justify-content:space-between;align-items:center;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--eng)}
.led{width:6px;height:6px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px #4ADE80}
.device.offline .led{background:#F5B841;box-shadow:0 0 8px #F5B841}
/* Slot-Zustände */
.key::after,.rkey::after,.knob-btn::after{content:"";position:absolute;pointer-events:none;border-radius:inherit;border:2px solid transparent;transition:border-color .15s,background .15s,box-shadow .2s}
.key::after{inset:-6px;border-radius:20px}
.rkey::after{inset:-12px}
.knob-btn::after{inset:-4px}
.sel::after{border-color:#35E0D0}
.target::after{border-color:rgba(53,224,208,.75);border-style:dashed}
.replace::after{border-color:rgba(53,224,208,.3);border-style:dashed}
.over::after{border-color:#35E0D0;background:rgba(53,224,208,.14);box-shadow:0 0 32px rgba(53,224,208,.5)}
.disabled{opacity:.28}
.press{box-shadow:0 0 0 2px #35E0D0,0 0 30px rgba(53,224,208,.55)!important}
.device-outline{width:700px;height:404px;border-radius:30px;border:2px dashed var(--line);padding:34px 36px;display:flex;gap:56px;flex:none}
.device-outline span{border:2px dashed var(--line);display:block}
@media (max-width:1460px){.stage .device,.stage .device-outline{zoom:.86}}
@media (max-width:1300px){.stage .device,.stage .device-outline{zoom:.74}}
@media (max-width:760px){.device,.device-outline{zoom:.48}}

/* ============ Seiten ============ */
.page{flex:1;display:flex;flex-wrap:wrap;align-items:stretch}
.page-main{flex:999 1 560px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.page h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:16px;padding:18px;border-radius:16px;border:1px solid var(--line2);background:var(--panel);text-align:left;transition:border-color .15s,transform .15s}
.pcard:hover{transform:translateY(-1px);border-color:var(--line)}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.state{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:13px}
.state.on{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.state.off{background:color-mix(in srgb,var(--faint) 15%,transparent);color:var(--muted)}
.detail{flex:1 1 380px;min-width:0;background:var(--panel);border-left:1px solid var(--line2);padding:28px;display:flex;flex-direction:column;gap:22px}
.detail dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 12px;font-size:13px}
.detail dt{color:var(--faint)} .detail dd{margin:0;overflow-wrap:anywhere}
.arow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2)}
.settings{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:32px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:32px}
.snav{flex:1 1 200px;display:flex;flex-direction:column;gap:4px;position:sticky;top:16px}
.snav a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.snav a:hover{background:var(--raised);color:var(--text)}
.sbody{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:20px}
.scard{border-radius:16px;border:1px solid var(--line2);background:var(--panel);scroll-margin-top:16px}
.scard h2{margin:0;padding:18px 20px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line2)}
.srow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.srow:last-child{border-bottom:0}
.srow .t{display:flex;flex-direction:column;gap:3px}
.srow .t b{font-size:14px;font-weight:500}
.srow .t span{font-size:13px;color:var(--muted)}
.blank{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}

/* Onboarding */
.ob{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.ob-card{width:100%;max-width:1180px;border-radius:24px;border:1px solid var(--line2);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.steps{margin:0;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:20px 28px;border-bottom:1px solid var(--line2)}
.steps li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--faint)}
.steps li.on,.steps li.done{color:var(--text)}
.steps .num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:13px;border:1px solid var(--line)}
.steps li.on .num{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
.steps li.done .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps .ln{width:48px;height:1px;background:var(--line)}
.ob-body{display:flex;flex-wrap:wrap;align-items:center;gap:40px;padding:44px 40px}
.ob-body .txt{flex:1 1 340px;display:flex;flex-direction:column;gap:18px}
.ob-body h1{margin:0;font-size:36px;line-height:1.12;font-weight:600;letter-spacing:-.025em}
.ob-body p{margin:0;font-size:16px;line-height:1.6;color:var(--muted)}
.ob-body .dev{flex:0 1 auto;margin:0 auto}
.ob-body .dev .device{zoom:.82}
@media (max-width:760px){.ob-body .dev .device{zoom:.48}}

/* Toast, Menüs, Dialog */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14px;white-space:nowrap;animation:rise .22s ease}
.toast .ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bg)}
.ctx{position:fixed;min-width:200px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);box-shadow:var(--shadow);z-index:90;animation:rise .12s ease}
.ctx button{width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:14px;text-align:left}
.ctx button:hover:not(:disabled){background:var(--hover)}
.ctx button:disabled{color:var(--faint);cursor:default}
.ctx button.red{color:var(--err-text)}
.ctx hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:95;padding:16px;animation:rise .15s ease}
.dialog{width:100%;max-width:420px;border-radius:18px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px}
.dialog h2{margin:0;font-size:18px;font-weight:600}
.err{font-size:13px;color:var(--err-text)}
.proto{position:fixed;left:16px;bottom:16px;z-index:80;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);box-shadow:var(--shadow);font-size:12px;color:var(--muted)}
.proto select{height:30px;border-radius:999px;border:1px solid var(--line);background:var(--input);padding:0 8px;font-size:12px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="overlay"></div>
<label class="proto" title="Nur für den Prototyp: Zustände durchspielen">Prototyp
<select id="protoState" aria-label="Zustand simulieren">
<option value="virtual">Virtuelles Gerät</option>
<option value="connected">TreasLin N3 verbunden</option>
<option value="disconnected">Gerät getrennt</option>
<option value="none">Kein Gerät</option>
<option value="offline">Dienst offline</option>
<option value="onboarding">Onboarding</option>
</select>
</label>

<script>
'use strict';
/* =====================================================================
   OpenDeckN3 – UI-Prototyp (eine Datei, keine Abhängigkeiten)
   Daten & Begriffe nach docs/UI_API.md und docs/UI_DESIGN_BRIEF.md.
   Alle Gerätezugriffe laufen über das Objekt `api` – dort später die
   WebSocket-Anbindung (ws://127.0.0.1:57131) einsetzen.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- Icons (Linien, 24er Raster) ---------- */
const ICONS = {
  camera: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
  screen: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  rec: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/>',
  counter: '<path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/>',
  terminal: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  profile: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  volume: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
  brightness: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plug: '<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v5"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  alert: '<path d="M12 6v7M12 17.5v.01"/>',
  usb: '<path d="M12 3v14M12 3l-2.5 3h5L12 3zM7 10v2.5l5 3M17 9.5V12l-5 3"/><circle cx="12" cy="19" r="2"/><circle cx="7" cy="9" r="1.3"/><rect x="15.6" y="7" width="2.8" height="2.5"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.8-4M4 3v4h4M4 13a8 8 0 0 0 14.8 4M20 21v-4h-4"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  chevron: '<path d="M6 9l6 6 6-6"/>',
  chevronRight: '<path d="M9 6l6 6-6 6"/>',
  grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
  file: '<path d="M6 3h8l4 4v14H6V3z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  play: '<path d="M7 5l12 7-12 7V5z"/>',
  key: '<rect x="4" y="4" width="16" height="16" rx="3.5"/><rect x="8" y="8" width="8" height="8" rx="1.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
  external: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  duplicate: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/>',
  grip: '<g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></g>'
};
const ic = (n, s = 18, sw = 1.75) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const LOGO = (s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#171A1F" stroke="#2E333B"/><rect x="5" y="7" width="4.5" height="4.5" rx="1.2" fill="#35E0D0"/><rect x="11" y="7" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><rect x="17" y="7" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><rect x="5" y="13" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><rect x="11" y="13" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><rect x="17" y="13" width="4.5" height="4.5" rx="1.2" fill="#ECEEF1"/><circle cx="7.2" cy="22" r="1.6" fill="#5B6370"/><circle cx="13.2" cy="22" r="1.6" fill="#5B6370"/><circle cx="19.2" cy="22" r="1.6" fill="#5B6370"/><circle cx="24.5" cy="10" r="2.4" fill="none" stroke="#35E0D0" stroke-width="1.4"/><circle cx="24.5" cy="20.5" r="1.6" fill="none" stroke="#A0A7B2" stroke-width="1.2"/></svg>`;

/* ---------- Katalog (Form wie CatalogPlugin aus der UI-API) ---------- */
const PLUGINS = [
  { uuid: 'opendeckn3.builtin', name: 'OpenDeckN3', author: 'OpenDeckN3', version: '0.1.0', category: 'System', kind: 'grid', connected: true },
  { uuid: 'de.opendeckn3.counter', name: 'Zähler (Beispiel)', author: 'OpenDeckN3', version: '1.0.0', category: 'Beispiele', kind: 'counter', connected: true },
  { uuid: 'com.obs.studio', name: 'OBS Studio', author: '[Autor]', version: '2.1.0', category: 'Streaming', kind: 'camera', connected: true },
  { uuid: 'com.audio.mixer', name: 'Audio-Mixer', author: '[Autor]', version: '0.4.2', category: 'Audio', kind: 'volume', connected: true },
  { uuid: 'de.opendeckn3.shell', name: 'Shell', author: '[Autor]', version: '0.2.0', category: 'Werkzeuge', kind: 'terminal', connected: false }
];
const ACTIONS = {
  brightness: { name: 'Helligkeit', plugin: 'opendeckn3.builtin', uuid: 'opendeckn3.builtin.brightness', ctl: ['Keypad', 'Encoder'], kind: 'brightness', tip: 'Gerätehelligkeit ändern', def: {} },
  profile: { name: 'Profil wechseln', plugin: 'opendeckn3.builtin', uuid: 'opendeckn3.builtin.profile', ctl: ['Keypad'], kind: 'profile', tip: 'Wechselt zu einem anderen Profil', def: { profile: 'default' } },
  counter: { name: 'Zähler', plugin: 'de.opendeckn3.counter', uuid: 'de.opendeckn3.counter.count', ctl: ['Keypad', 'Encoder'], kind: 'counter', tip: 'Zählt Tastendrücke', def: { count: 0 } },
  scene: { name: 'Szene wechseln', plugin: 'com.obs.studio', uuid: 'com.obs.scene', ctl: ['Keypad'], kind: 'camera', tip: 'Aktiviert eine OBS-Szene', def: { scene: 'Kamera' } },
  record: { name: 'Aufnahme', plugin: 'com.obs.studio', uuid: 'com.obs.record', ctl: ['Keypad'], kind: 'rec', tip: 'Startet oder stoppt die Aufnahme', def: {} },
  volume: { name: 'Lautstärke', plugin: 'com.audio.mixer', uuid: 'com.audio.volume', ctl: ['Encoder', 'Keypad'], kind: 'volume', tip: 'Lautstärke einer Quelle', def: { target: 'Master', value: 50 } },
  mute: { name: 'Mikro stumm', plugin: 'com.audio.mixer', uuid: 'com.audio.mute', ctl: ['Keypad'], kind: 'mic', tip: 'Mikrofon stummschalten', def: {} },
  terminal: { name: 'Befehl ausführen', plugin: 'de.opendeckn3.shell', uuid: 'de.opendeckn3.shell.run', ctl: ['Keypad'], kind: 'terminal', tip: 'Führt einen Shell-Befehl aus', def: { command: '' } }
};
const plug = (uuid) => PLUGINS.find((p) => p.uuid === uuid);
const KCOL = {
  camera: ['#0F2236', '#8CCBFF'], screen: ['#191D3B', '#B3BCFF'], rec: ['#2A1416', '#E7A3A3'], recOn: ['#561418', '#FFB1B1'],
  counter: ['#0D2927', '#5FF0E2'], terminal: ['#18230F', '#B4EA8A'], mic: ['#2A1832', '#E6B3FF'], profile: ['#22252B', '#D7DBE1'],
  brightness: ['#2C240E', '#F7D886'], volume: ['#10202D', '#9DD6FF'], grid: ['#1C2A2A', '#5FF0E2']
};

/* ---------- Zustand ---------- */
const INITIAL_PROFILES = {
  default: { keys: { 6: { a: 'profile', title: null, settings: { profile: 'streaming' } } }, encoders: { 1: { a: 'brightness', title: null, settings: {} } } },
  streaming: {
    keys: {
      0: { a: 'scene', title: 'Kamera', settings: { scene: 'Kamera' } },
      1: { a: 'scene', title: 'Screen', settings: { scene: 'Screen' } },
      2: { a: 'record', title: 'REC', state: 1, settings: {} },
      3: { a: 'counter', title: null, settings: { count: 12 } },
      6: { a: 'profile', title: null, settings: { profile: 'coding' } }
    },
    encoders: { 0: { a: 'volume', title: null, settings: { target: 'Master', value: 64 } }, 1: { a: 'brightness', title: null, settings: {} } }
  },
  coding: {
    keys: {
      0: { a: 'terminal', title: 'Build', settings: { command: 'cargo build' } },
      1: { a: 'terminal', title: 'Test', settings: { command: 'cargo test' } },
      2: { a: 'mute', title: 'Mute', settings: {} },
      6: { a: 'profile', title: null, settings: { profile: 'streaming' } }
    },
    encoders: { 0: { a: 'volume', title: null, settings: { target: 'Musik', value: 40 } } }
  }
};

const S = {
  route: 'editor',             // editor | plugins | settings | onboarding
  device: 'virtual',           // virtual | connected | disconnected | none | offline
  theme: 'dark', finish: 'dunkel',
  profiles: clone(INITIAL_PROFILES), active: 'streaming',
  sel: 'k3', test: true, brightness: 70,
  pressed: null, flip: false,
  drag: null, over: null,
  q: '', closed: {},
  pluginSel: 'com.obs.studio',
  prefs: { lang: 'de', autostart: true, sleep: '10', port: '57131' },
  ob: { step: 0, found: false, copied: false, placed: false },
  menu: null, popover: null, modal: null
};

const isLive = () => S.device === 'virtual' || S.device === 'connected';
const prof = () => S.profiles[S.active];
const parseId = (id) => ({ c: id[0] === 'k' ? 'keys' : 'encoders', p: +id.slice(1), ctl: id[0] === 'k' ? 'Keypad' : 'Encoder' });
const slot = (id) => { const { c, p } = parseId(id); return prof()[c][p] || null; };
const slotName = (id) => { const { p } = parseId(id); return id[0] === 'k' ? 'K' + p + (p < 6 ? ' · Display' : ' · Taste') : 'E' + p + (p === 1 ? ' · großer Regler' : ' · Drehregler'); };
const kindOf = (s) => !s ? 'plus' : (s.a === 'scene' && s.settings.scene === 'Screen') ? 'screen' : ACTIONS[s.a].kind;

/* ---------- API-Schicht (Mock; Signaturen wie docs/UI_API.md) ---------- */
const api = {
  setAction(id, actionId) {
    const { c, p } = parseId(id); const a = ACTIONS[actionId];
    prof()[c][p] = { a: actionId, title: null, state: 0, settings: clone(a.def) };
  },
  clearAction(id) { const { c, p } = parseId(id); delete prof()[c][p]; },
  setActionSettings(id, key, value) { const s = slot(id); if (s) s.settings[key] = value; },
  setActionAppearance(id, title) { const s = slot(id); if (s) s.title = title || null; },
  setBrightness(v) { S.brightness = clamp(v, 0, 100); },
  switchProfile(id) { if (!S.profiles[id]) S.profiles[id] = { keys: {}, encoders: {} }; S.active = id; },
  deleteProfile(id) { if (id !== S.active) delete S.profiles[id]; }
};

/* ---------- Toasts ---------- */
function toast(kind, text) {
  const col = { ok: 'var(--ok)', err: 'var(--err)', warn: 'var(--warn)' }[kind];
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="ic" style="background:${col}">${ic(kind === 'ok' ? 'check' : 'alert', 14, 2.25)}</span><span>${esc(text)}</span>`;
  const box = $('#toasts'); box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2800);
}

/* =====================================================================
   Gerät
   ===================================================================== */
function viewSlots() {
  const P = prof();
  const keys = [0, 1, 2, 3, 4, 5, 6, 7, 8].map((p) => {
    const s = P.keys[p]; const id = 'k' + p;
    if (!s) return { id, pos: p, empty: true };
    const a = ACTIONS[s.a];
    return {
      id, pos: p, kind: kindOf(s), active: s.a === 'record' && !!s.state,
      big: s.a === 'counter' ? String(s.settings.count) : null,
      title: s.title ?? (s.a === 'profile' ? '→ ' + s.settings.profile : s.a === 'counter' ? 'Zähler' : a.name)
    };
  });
  const encs = [0, 1, 2].map((p) => {
    const s = P.encoders[p]; const id = 'e' + p;
    if (!s) return { id, pos: p, empty: true, label: 'Frei', sub: '', value: null };
    let value = null, sub = '';
    if (s.a === 'volume') { value = +s.settings.value; sub = s.settings.target + ' · ' + value + ' %'; }
    else if (s.a === 'brightness') { value = S.brightness; sub = value + ' %'; }
    else if (s.a === 'counter') { sub = String(s.settings.count); }
    return { id, pos: p, kind: kindOf(s), label: s.title ?? ACTIONS[s.a].name, sub, value };
  });
  return { keys, encs };
}

function deviceHTML(v, o = {}) {
  const cls = ['device'];
  if (S.finish === 'weiss') cls.push('white');
  if (o.offline) cls.push('offline');
  if (o.flip) cls.push('flip');
  const dragCtl = o.dragCtl || (o.drag ? ACTIONS[o.drag].ctl : null);
  const st = (x) => {
    const c = [];
    if (o.sel === x.id && !o.drag) c.push('sel');
    if (o.pressed === x.id) c.push('press');
    if (dragCtl) {
      const ok = dragCtl.includes(x.id[0] === 'k' ? 'Keypad' : 'Encoder');
      if (!ok) c.push('disabled'); else if (o.over === x.id) c.push('over'); else c.push(x.empty ? 'target' : 'replace');
    }
    return c.join(' ');
  };
  const at = (x) => o.interactive ? `data-slot="${x.id}" aria-pressed="${o.sel === x.id}"` : 'tabindex="-1"';
  const aria = (x, what) => `${what} ${x.id.toUpperCase()}${x.empty ? ', frei' : ', ' + (x.title || x.label)}`;

  const dk = (x) => {
    let inner;
    if (x.empty) inner = `<span class="screen empty">${ic('plus', 22)}</span>`;
    else {
      const c = x.active ? KCOL.recOn : (KCOL[x.kind] || KCOL.profile);
      inner = `<span class="screen" style="background:${c[0]};color:${c[1]}">${x.big != null
        ? `<span class="big">${esc(x.big)}</span><span class="small">${esc(x.title)}</span>`
        : `${ic(x.kind, 26)}<span class="t">${esc(x.title)}</span>`}</span>`;
    }
    return `<button type="button" class="key ${st(x)}" ${at(x)} aria-label="${esc(aria(x, 'Display-Taste'))}">${inner}</button>`;
  };
  const rk = (x) => `<div class="rkey-wrap"><button type="button" class="rkey ${x.empty ? 'isempty' : ''} ${st(x)}" ${at(x)} aria-label="${esc(aria(x, 'Taste'))}">${x.empty ? ic('plus', 16) : ic(x.kind, 18)}</button><span class="rlabel ${x.empty ? 'e' : ''}">${esc(x.empty ? x.id.toUpperCase() : x.title)}</span></div>`;
  const kn = (x, size) => {
    const v = x.value;
    const dash = v == null ? '0 400' : (235.6 * v / 100).toFixed(1) + ' 400';
    const rot = v == null ? 0 : -135 + 270 * v / 100;
    return `<div class="knob-wrap ${size} ${x.empty ? 'isempty' : ''}">
      <button type="button" class="knob-btn ${st(x)}" ${at(x)} ${o.interactive ? `data-enc="${x.pos}"` : ''} aria-label="${esc(aria(x, 'Drehregler'))}">
        <svg viewBox="0 0 108 108" aria-hidden="true"><circle class="trk" cx="54" cy="54" r="50" stroke-dasharray="235.6 400" transform="rotate(135 54 54)"/><circle class="val" cx="54" cy="54" r="50" stroke-dasharray="${dash}" transform="rotate(135 54 54)"/></svg>
        <span class="knob" style="transform:rotate(${rot}deg)"><i></i></span>
      </button>
      <div class="klabel ${x.empty ? 'e' : ''}">${x.empty ? '' : ic(x.kind, 13)}${esc(x.label)}</div>
      <div class="ksub">${esc(x.sub)}</div>
    </div>`;
  };
  const k = v.keys, e = v.encs;
  return `<div class="${cls.join(' ')}" style="--dim:${(0.4 + 0.6 * (o.brightness ?? S.brightness) / 100).toFixed(2)}" role="group" aria-label="TreasLin N3">
    <div class="dev-row">
      <div class="dev-left">
        <div class="keys">${k.slice(0, 6).map(dk).join('')}</div>
        <div class="rkeys">${k.slice(6).map(rk).join('')}</div>
      </div>
      <div class="dev-right">${kn(e[1], 'big')}<div class="knob-row">${kn(e[0], 'small')}${kn(e[2], 'small')}</div></div>
    </div>
    <div class="engrave"><span>TREASLIN · N3</span><span class="led"></span></div>
  </div>`;
}

const GROUPS = [
  { id: 'opendeckn3.builtin', label: 'System' },

function libListHTML() {
  const q = S.q.trim().toLowerCase();
  let hits = 0;
  const html = GROUPS.map((g) => {
    const items = Object.entries(ACTIONS).filter(([, a]) => a.plugin === g.id && (!q || a.name.toLowerCase().includes(q)));
    if (!items.length) return '';
    hits += items.length;
    const open = !S.closed[g.id] || !!q;
    const p = plug(g.id);
    return `<div>
      <button type="button" class="grp" data-act="group" data-arg="${g.id}" aria-expanded="${open}">${ic('chevronRight', 14)}<span>${g.label}</span><span class="n">${items.length}</span></button>
      ${open ? items.map(([id, a]) => `
        <div class="item ${S.drag === id ? 'dragging' : ''}" draggable="true" data-pick="${id}" role="button" tabindex="0" title="${esc(p.connected ? a.tip : 'Plugin läuft nicht')}">
          <span class="grip">${ic('grip', 14)}</span>

  return html + (hits ? '' : '<div style="padding:16px 8px;font-size:13px;color:var(--faint)">Keine Aktion gefunden.</div>');
}

function stageInner() {
  const v = viewSlots();

    top = `<div class="pill">${ic('info', 15)}<span><b style="color:var(--text);font-weight:500">${esc(a.name)}</b> passt auf ${a.ctl.length === 2 ? 'Tasten und Drehregler' : a.ctl[0] === 'Keypad' ? 'Tasten – Drehregler sind gesperrt' : 'Drehregler – Tasten sind gesperrt'}</span></div>`;
  } else if (emptyProfile && isLive()) {
    top = `<div class="hint rise"><span class="tile">${ic('grip', 20)}</span><span style="display:flex;flex-direction:column;gap:3px"><b style="font-size:15px;font-weight:600">Ziehe eine Aktion auf eine Taste</b><span style="font-size:13px;color:var(--muted);line-height:1.45">Oder wähle einen Slot und klicke links auf eine Aktion.</span></span></div>`;
  }
  return top + deviceHTML(v, { interactive: true, sel: S.sel, pressed: S.pressed, drag: S.drag, over: S.over, offline: S.device === 'disconnected', flip: S.flip });
}

  } else {

function onboardingHTML() {
  const o = S.ob;
  const labels = ['Willkommen', 'Gerät anschließen', 'Erste Aktion'];
  const steps = labels.map((l, i) => `<li class="${i < o.step ? 'done' : i === o.step ? 'on' : ''}" ${i === o.step ? 'aria-current="step"' : ''}><span class="num">${i < o.step ? ic('check', 14, 2.25) : i + 1}</span>${l}${i < 2 ? '<span class="ln"></span>' : ''}</li>`).join('');
  const empty = (p) => ({ id: 'k' + p, pos: p, empty: true });
  const emptyE = (p) => ({ id: 'e' + p, pos: p, empty: true, label: 'Frei', sub: '', value: null });
  let body = '';
  if (o.step === 0) {
    const demo = viewSlots();
    body = `<div class="ob-body rise"><div class="txt">
      <span class="label" style="color:var(--accent-text)">Willkommen</span>
      <h1>Neun Tasten. Drei Regler. Deine Regeln.</h1>
      <p>OpenDeckN3 belegt deinen TreasLin N3 per Drag &amp; Drop mit Aktionen – Szenen, Lautstärke, Profile, Plugins. Alles wird live auf dem Gerät gespiegelt.</p>
      <div><button type="button" class="btn primary lg" data-act="obNext">Los geht’s ${ic('arrow', 16)}</button></div>
    </div><div class="dev">${deviceHTML(demo, {})}</div></div>`;
  } else if (o.step === 1) {
    body = `<div class="ob-body rise" style="flex-direction:column;align-items:stretch;max-width:720px">
      <h1>Gerät anschließen</h1>
      <p>Stecke den TreasLin N3 per USB ein. Unter Linux braucht OpenDeckN3 einmalig Zugriff auf das Gerät:</p>
      ${udevBox()}
      <div role="status" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid ${o.found ? 'color-mix(in srgb,var(--ok) 40%,transparent)' : 'var(--line2)'};background:${o.found ? 'color-mix(in srgb,var(--ok) 7%,transparent)' : 'var(--panel2)'}">
        ${o.found ? `<span class="tile" style="width:24px;height:24px;border-radius:50%;background:var(--ok);color:#06210F">${ic('check', 14, 2.25)}</span><span><b style="font-weight:600">TreasLin N3</b> gefunden <span class="mono" style="font-size:12px;color:var(--muted)">n3-355499441494 · FW V3.0.1</span></span>`
          : `<span class="spin" style="width:18px;height:18px"></span><span style="color:var(--muted)">Warte auf Gerät …</span>`}
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
        <button type="button" class="btn lg" data-act="obBack" style="background:transparent">Zurück</button>
        <button type="button" class="btn primary lg" data-act="obNext" ${o.found ? '' : 'disabled style="opacity:.55;cursor:default"'}>Weiter ${ic('arrow', 16)}</button>
        <button type="button" class="btn ghost" data-act="obVirtual" style="color:var(--accent-text)">Ohne Hardware: virtuelles Gerät verwenden</button>
      </div>
    </div>`;
  } else {
    const v = {
      keys: [0, 1, 2, 3, 4, 5, 6, 7, 8].map(empty),
      encs: [0, 1, 2].map((p) => p === 1 && o.placed ? { id: 'e1', pos: 1, kind: 'brightness', label: 'Helligkeit', sub: S.brightness + ' %', value: S.brightness } : emptyE(p))
    };
    body = `<div class="ob-body rise"><div class="txt">
      <h1>Erste Aktion platzieren</h1>
      <p>Ziehe <b style="color:var(--text)">Helligkeit</b> auf den großen Drehregler – oder klicke darauf. Danach regelst du das Display direkt am Gerät.</p>
      <div class="item" data-act="obPlace" draggable="true" data-obdrag="1" role="button" tabindex="0" style="align-self:flex-start;max-width:280px;border:1.5px ${o.placed ? 'solid' : 'dashed'} var(--accent);background:var(--raised);opacity:${o.placed ? .5 : 1};padding:8px 16px 8px 10px">
        <span class="tile" style="background:${KCOL.brightness[0]};color:${KCOL.brightness[1]}">${ic('brightness', 18)}</span>
        <span><span class="nm">Helligkeit</span><span class="meta"><span class="chip">Taste</span><span class="chip">Drehregler</span></span></span>
      </div>
      ${o.placed ? `<div class="rise" style="display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ok)">${ic('check', 18, 2.25)}Platziert auf E1 – dreh mal am Gerät.</div>
          <div><button type="button" class="btn primary lg" data-act="obDone">Zum Editor ${ic('arrow', 16)}</button></div></div>`
        : '<div><button type="button" class="btn" data-act="obBack" style="background:transparent">Zurück</button></div>'}
    </div><div class="dev" id="obdev">${deviceHTML(v, { dragCtl: o.placed ? null : ['Encoder'], sel: o.placed ? 'e1' : null })}</div></div>`;
  }
  return `<main class="ob"><div class="ob-card">
    <ol class="steps" aria-label="Einrichtung">${steps}<li style="margin-left:auto"><button type="button" class="btn ghost" data-act="obDone" style="height:32px">Überspringen</button></li></ol>
    ${body}
  </div></main>`;
}

/* =====================================================================
   Rendern
   ===================================================================== */
function render() {
  const keepFocus = document.activeElement && document.activeElement.closest && document.activeElement.closest('.device');
  let view;
  if (S.route === 'onboarding') view = onboardingHTML();
  else if (S.device === 'offline' && S.route !== 'settings') view = offlineHTML();
  else if (S.route === 'plugins') view = pluginsHTML();
  else if (S.route === 'settings') view = settingsHTML();
  else if (S.device === 'none') view = noDeviceHTML();
  else view = editorHTML();
  $('#app').innerHTML = (S.route === 'onboarding' ? '' : barHTML()) + view;
  $('#protoState').value = S.route === 'onboarding' ? 'onboarding' : S.device;
  renderOverlay();
  if (keepFocus) { const b = document.querySelector(`[data-slot="${S.sel}"]`); if (b) b.focus(); }
}
function renderStage() {
  const st = $('#stage'); if (!st) return;
  const keepFocus = document.activeElement && document.activeElement.closest && document.activeElement.closest('.device');
  st.innerHTML = stageInner();
  st.classList.toggle('dragmode', !!S.drag);
  if (keepFocus) { const b = document.querySelector(`[data-slot="${S.sel}"]`); if (b) b.focus(); }
}
function renderOverlay() {
  let html = '';
  if (S.menu) {
    const s = slot(S.menu.id);
    html += `<div class="ctx" role="menu" style="left:${S.menu.x}px;top:${S.menu.y}px">
      <div class="mono" style="font-size:11px;color:var(--faint);padding:6px 10px 4px">${slotName(S.menu.id)}</div>
      <button type="button" role="menuitem" data-act="menuEdit">${ic('edit', 16)}Bearbeiten</button>
      <button type="button" role="menuitem" disabled>${ic('duplicate', 16)}Duplizieren <span style="margin-left:auto;font-size:11px">später</span></button>
      <hr><button type="button" role="menuitem" class="red" data-act="menuClear" ${s ? '' : 'disabled'}>${ic('trash', 16)}Entfernen</button>
    </div>`;
  }
  if (S.modal) {
    html += `<div class="scrim" data-act="closeModal"><form class="dialog" id="newProfileForm" role="dialog" aria-modal="true" aria-labelledby="dlgT">
      <h2 id="dlgT">Neues Profil</h2>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)">Name
        <input class="field mono" id="newProfileName" value="${esc(S.modal.value)}" placeholder="z. B. gaming" autocomplete="off"></label>
      <div class="err" id="dlgErr">${esc(S.modal.error || '')}</div>
      <div style="font-size:12px;color:var(--faint)">Erlaubt: A–Z a–z 0–9 - _ . (nicht mit „.“ beginnen)</div>
      <div style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn ghost" data-act="closeModal">Abbrechen</button><button type="submit" class="btn primary">Anlegen</button></div>
    </form></div>`;
  }
  $('#overlay').innerHTML = html;
  if (S.modal) { const i = $('#newProfileName'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  if (S.menu) { const m = $('.ctx'); const r = m.getBoundingClientRect(); if (r.right > innerWidth - 8) m.style.left = (innerWidth - r.width - 8) + 'px'; if (r.bottom > innerHeight - 8) m.style.top = (innerHeight - r.height - 8) + 'px'; }
}

/* =====================================================================
   Verhalten
   ===================================================================== */
let pressTimer, flipTimer, findTimer, copyTimer;
function flash(id) { clearTimeout(pressTimer); S.pressed = id; renderStage(); pressTimer = setTimeout(() => { S.pressed = null; renderStage(); }, 240); }
function switchProfile(id) {
  api.switchProfile(id); S.flip = true; S.sel = 'k0';
  render(); clearTimeout(flipTimer); flipTimer = setTimeout(() => { S.flip = false; renderStage(); }, 400);
}
function fire(id) {
  flash(id);
  const s = slot(id); if (!s) return;
  if (s.a === 'counter') { s.settings.count = (+s.settings.count || 0) + 1; render(); }
  if (s.a === 'record') { s.state = s.state ? 0 : 1; toast('ok', s.state ? 'Aufnahme läuft' : 'Aufnahme gestoppt'); renderStage(); }
  if (s.a === 'profile' && S.profiles[s.settings.profile]) switchProfile(s.settings.profile);
  if (s.a === 'mute') toast('ok', 'Mikrofon umgeschaltet');
  if (s.a === 'terminal') toast(plug('de.opendeckn3.shell').connected ? 'ok' : 'warn', plug('de.opendeckn3.shell').connected ? 'Befehl ausgeführt' : 'Plugin „Shell“ läuft nicht');
  if (s.a === 'scene') toast('ok', 'Szene „' + s.settings.scene + '“ aktiv');
}
function twist(pos, d) {
  const s = prof().encoders[pos]; flash('e' + pos); if (!s) return;
  if (s.a === 'brightness') { api.setBrightness(S.brightness + d * 5); render(); return; }
  if (s.a === 'volume') s.settings.value = clamp((+s.settings.value || 0) + d * 4, 0, 100);
  if (s.a === 'counter') s.settings.count = (+s.settings.count || 0) + d;
  render();
}
function assign(actionId, id) {
  const a = ACTIONS[actionId]; const { ctl } = parseId(id);
  if (!a.ctl.includes(ctl)) { toast('err', `${a.name} unterstützt keine ${ctl === 'Encoder' ? 'Drehregler' : 'Tasten'}`); return false; }
  api.setAction(id, actionId); S.sel = id;
  toast('ok', `${a.name} → ${id.toUpperCase()}`);
  return true;
}
function applyTheme() {
  const t = S.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : S.theme;
  document.documentElement.dataset.theme = t;
}
function moveSel(key) {
  const grid = [['k0', 'k1', 'k2', 'e1'], ['k3', 'k4', 'k5', 'e1'], ['k6', 'k7', 'k8', 'e0', 'e2']];
  let r = grid.findIndex((row) => row.includes(S.sel)); let c = grid[r].indexOf(S.sel);
  if (S.sel === 'e1' && r === 0 && key === 'ArrowDown') { S.sel = 'e2'; return; }
  if (key === 'ArrowRight') c = Math.min(grid[r].length - 1, c + 1);
  if (key === 'ArrowLeft') c = Math.max(0, c - 1);
  if (key === 'ArrowDown') { r = Math.min(2, r + 1); c = Math.min(c, grid[r].length - 1); }
  if (key === 'ArrowUp') { r = Math.max(0, r - 1); c = Math.min(c, grid[r].length - 1); }
  S.sel = grid[r][c];
}

const ACTS = {
  nav(arg) { S.route = arg; S.popover = null; render(); scrollTo(0, 0); },
  popover(arg) { S.popover = S.popover === arg ? null : arg; render(); },
  device(arg) { S.device = arg; S.popover = null; if (S.route === 'onboarding') S.route = 'editor'; render(); if (arg === 'connected') toast('ok', 'TreasLin N3 verbunden'); if (arg === 'virtual') toast('ok', 'Virtuelles Gerät aktiv'); },
  test() { S.test = !S.test; render(); },
  group(arg) { S.closed[arg] = !S.closed[arg] ? true : false; $('#liblist').innerHTML = libListHTML(); },
  clear() { api.clearAction(S.sel); toast('ok', 'Belegung entfernt'); render(); },
  pickImage() { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = () => i.files[0] && toast('ok', 'Bild „' + i.files[0].name + '“ übernommen (wird als Data-URL gesendet)'); i.click(); },
  resetImage() { toast('ok', 'Standardbild wiederhergestellt'); },
  newProfile() { S.modal = { value: '', error: '' }; renderOverlay(); },
  closeModal(arg, e) { if (e && e.target.closest('.dialog') && !e.target.closest('[data-act="closeModal"].btn')) return; S.modal = null; renderOverlay(); },
  menuEdit() { S.menu = null; renderOverlay(); const i = $('[data-in="title"]'); if (i) i.focus(); },
  menuClear() { const id = S.menu.id; S.menu = null; S.sel = id; api.clearAction(id); toast('ok', 'Belegung entfernt'); render(); },
  plugin(arg) { S.pluginSel = arg; render(); },
  install() { toast('warn', 'Plugin-Installation kommt mit Meilenstein M1'); },
  openFolder() { toast('ok', 'Öffnet ~/.config/opendeckn3 im Dateimanager'); },
  log() { toast('ok', 'Log: RUST_LOG=n3_driver=trace opendeckn3d'); },
  retry() { toast('warn', 'Dienst weiterhin nicht erreichbar'); },
  theme(arg) { S.theme = arg; applyTheme(); render(); },
  finish(arg) { S.finish = arg; render(); },
  autostart() { S.prefs.autostart = !S.prefs.autostart; render(); },
  copyUdev() {
    const done = () => { S.ob.copied = true; render(); clearTimeout(copyTimer); copyTimer = setTimeout(() => { S.ob.copied = false; render(); }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(UDEV).then(done, done); else done();
  },
  obNext() { goStep(Math.min(2, S.ob.step + 1)); },
  obBack() { goStep(Math.max(0, S.ob.step - 1)); },
  obVirtual() { S.ob.found = true; S.device = 'virtual'; goStep(2); },
  obPlace() { if (S.ob.placed) return; S.ob.placed = true; render(); },
  obDone() {
    if (S.ob.placed && !prof().encoders[1]) api.setAction('e1', 'brightness');
    S.route = 'editor'; if (S.device === 'none' || S.device === 'offline') S.device = 'virtual';
    S.sel = 'e1'; render();
  }
};
function goStep(n) {
  S.ob.step = n; render();
  if (n === 1 && !S.ob.found) { clearTimeout(findTimer); findTimer = setTimeout(() => { S.ob.found = true; if (S.route === 'onboarding') render(); }, 2600); }
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', (e) => {
  if (S.menu && !e.target.closest('.ctx')) { S.menu = null; renderOverlay(); }
  if (S.popover && !e.target.closest('.popover') && !e.target.closest('[data-act="popover"]')) { S.popover = null; render(); }
  const slotEl = e.target.closest('[data-slot]');
  if (slotEl) {
    const id = slotEl.dataset.slot; S.sel = id;
    if (S.device === 'virtual' && S.test) { render(); fire(id); } else render();
    return;
  }
  const pick = e.target.closest('[data-pick]');
  if (pick) { if (assign(pick.dataset.pick, S.sel)) render(); return; }
  const act = e.target.closest('[data-act]');
  if (act && ACTS[act.dataset.act]) ACTS[act.dataset.act](act.dataset.arg, e);
});

document.addEventListener('contextmenu', (e) => {
  const slotEl = e.target.closest('[data-slot]');
  if (!slotEl) return;
  e.preventDefault();
  S.sel = slotEl.dataset.slot; S.menu = { id: S.sel, x: e.clientX, y: e.clientY };
  render();
});

document.addEventListener('input', (e) => {
  const t = e.target; const k = t.dataset.in; if (!k) return;
  if (k === 'q') { S.q = t.value; $('#liblist').innerHTML = libListHTML(); }
  else if (k === 'brightness') { api.setBrightness(+t.value); document.querySelectorAll('[data-in="brightness"]').forEach((el) => { if (el !== t) el.value = S.brightness; }); document.querySelectorAll('output').forEach((o) => { o.textContent = S.brightness + ' %'; }); renderStage(); }
  else if (k === 'title') { api.setActionAppearance(S.sel, t.value); renderStage(); }
  else if (k === 'setting') { const s = slot(S.sel); const old = s.settings[t.dataset.key]; api.setActionSettings(S.sel, t.dataset.key, typeof old === 'number' && t.value.trim() !== '' && !isNaN(+t.value) ? +t.value : t.value); renderStage(); }
  else if (k === 'pref') { S.prefs[t.dataset.key] = t.value; }
});
document.addEventListener('change', (e) => {
  const t = e.target; const k = t.dataset.in;
  if (k === 'profile') switchProfile(t.value);
  if (k === 'profileTarget') { api.setActionSettings(S.sel, 'profile', t.value); renderStage(); }
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'newProfileForm') return;
  e.preventDefault();
  const v = $('#newProfileName').value.trim();
  let err = '';
  if (!v) err = 'Bitte einen Namen eingeben.';
  else if (!/^[A-Za-z0-9_\-][A-Za-z0-9_.\-]*$/.test(v)) err = 'Nur A–Z a–z 0–9 - _ . erlaubt, nicht mit „.“ am Anfang.';
  else if (S.profiles[v]) err = 'Ein Profil mit diesem Namen gibt es schon.';
  if (err) { S.modal = { value: v, error: err }; renderOverlay(); return; }
  S.modal = null; renderOverlay(); switchProfile(v); toast('ok', `Profil „${v}“ angelegt`);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.modal) { S.modal = null; renderOverlay(); return; }
    if (S.menu) { S.menu = null; renderOverlay(); return; }
    if (S.popover) { S.popover = null; render(); return; }
  }
  const pick = e.target.closest && e.target.closest('[data-pick],[data-obdrag]');
  if (pick && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick.click(); return; }
  if (!(e.target.closest && e.target.closest('.device [data-slot]'))) return;
  if (e.key.startsWith('Arrow')) { e.preventDefault(); moveSel(e.key); render(); }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); if (slot(S.sel)) { api.clearAction(S.sel); toast('ok', 'Belegung entfernt'); render(); } }
});

document.addEventListener('wheel', (e) => {
  const b = e.target.closest && e.target.closest('[data-enc]');
  if (!b || S.device !== 'virtual' || !S.test) return;
  e.preventDefault();
  S.sel = 'e' + b.dataset.enc;
  twist(+b.dataset.enc, e.deltaY < 0 ? 1 : -1);
}, { passive: false });

/* Drag & Drop: Bibliothek → Slot */
document.addEventListener('dragstart', (e) => {
  const ob = e.target.closest && e.target.closest('[data-obdrag]');
  if (ob) { e.dataTransfer.setData('text/plain', 'ob'); return; }
  const it = e.target.closest && e.target.closest('[data-pick]'); if (!it) return;
  S.drag = it.dataset.pick;
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', S.drag);
  it.classList.add('dragging');
  requestAnimationFrame(renderStage);
});
document.addEventListener('dragover', (e) => {
  if (S.route === 'onboarding') { if (e.target.closest('#obdev')) e.preventDefault(); return; }
  if (!S.drag) return;
  const el = e.target.closest('[data-slot]');
  let over = null;
  if (el && ACTIONS[S.drag].ctl.includes(parseId(el.dataset.slot).ctl)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; over = el.dataset.slot; }
  if (over !== S.over) { S.over = over; renderStage(); }
});
document.addEventListener('drop', (e) => {
  if (S.route === 'onboarding') { if (e.target.closest('#obdev')) { e.preventDefault(); ACTS.obPlace(); } return; }
  if (!S.drag) return;
  e.preventDefault();
  const el = e.target.closest('[data-slot]');
  const id = S.drag; S.drag = null; S.over = null;
  if (el) assign(id, el.dataset.slot);
  render();
});
document.addEventListener('dragend', () => { if (S.drag) { S.drag = null; S.over = null; render(); } });

$('#protoState').addEventListener('change', (e) => {
  const v = e.target.value;
  if (v === 'onboarding') { S.route = 'onboarding'; S.ob = { step: 0, found: false, copied: false, placed: false }; render(); return; }
  S.device = v; if (S.route === 'onboarding') S.route = 'editor';
  render();
  if (v === 'disconnected') toast('warn', 'Gerät getrennt');
});
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S.theme === 'system') applyTheme(); });

applyTheme();
render();
</script>
</body>
</html>
