[package]
name = "n3-daemon"
description = "OpenDeckN3 Hintergrunddienst: Geräte, Profile, Plugins und UI-API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opendeckn3d"
path = "src/main.rs"

[dependencies]
n3-core.workspace = true
n3-driver.workspace = true
n3-plugin.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
data-url.workspace = true
base64.workspace = true
dirs.workspace = true
clap.workspace = true
enigo = "0.6"
open = "5"
shell-words = "1"
ab_glyph = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sha2 = "0.10"
semver = "1"

# Same version enigo/async-hid already pull in; used for app icons.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"
